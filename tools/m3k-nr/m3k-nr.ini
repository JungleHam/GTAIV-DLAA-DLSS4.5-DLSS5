[M3K]
; Re-read once per second while the Feeder Vulkan path is active.
; 0 = unchanged DLAA, no NR load/create/evaluation (default)
; 1 = M3K-A0: load/create feature 18, keep original color feeding DLAA
; 2 = M3K-A1/A2-S2: raw color -> feature 18 -> downstream DLSS
; After a failure, set 0, wait for its log, then set 1 or 2 to retry.
Mode=0

; A2-S2.2 multi-pass NR:
; 1 = proven single feature-18 pass (default)
; 2 = two independent feature-18 passes chained before DLSS SR
; 3 = three independent feature-18 passes chained before DLSS SR
; Each pass has its own feature handle, parameters, output texture, and temporal history.
NRPasses=1

; A2-S0.5 diagnostic only:
; 0 = normal final image
; 1 = copy true DXVK D3D9 source pixels 1:1 over the top-left of final output.
; Do not use at the same time as SRProof.
SourceProof=0

; A2-S1/A2-S2 Super Resolution path:
; 0 = baseline DLAA
; 1 = true low-res DXVK colour + scaled low-res guides -> optional NR -> DLSS SR -> presenter resolution.
; Jitter is still 0 at the current proof milestone.
SRProof=0

; A2-S1B DXVK render/presenter split.
; 0x0 render = do not override GTA's D3D9 backbuffer size.
; Non-zero render dimensions force the true D3D9/DXVK source size while windowed.
RenderWidth=0
RenderHeight=0

; 0x0 output = use the monitor resolution containing GTA's window.
; Non-zero values request that output/client size explicitly.
OutputWidth=0
OutputHeight=0

; 1 = resize/reposition GTA's window client to OutputWidth/Height (or monitor size)
; without changing the forced D3D9 render size. Keep GTA/FusionFix windowed.
AutoResizeWindow=0
