name: TEMP Repin Startup Prime Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-integrate-startup-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repin installer and manifest
        shell: python
        run: |
          from pathlib import Path
          import json

          old_commit = 'dfc68aea19a295ca09f68c3a7ee07eb19068f41b'
          old_hash = 'B98BF323C3F454C2B7DB70FDCDE05B0F67954EA9507EA957F8E1A58A6A4BFBDB'
          new_commit = '12ae20c8789495064b32a3e0bf71072796fd46dc'
          new_hash = '639856C7AFBD5BBE7BC46A38E839BA8EC95D912EFE7190975315045DBB5313BF'

          installer = Path('install/Install-DLSS-Full.bat')
          text = installer.read_text(encoding='utf-8')
          if text.count(old_commit) != 1 or text.count(old_hash) != 1:
              raise SystemExit('expected old startup-prime pin exactly once in installer')
          text = text.replace(old_commit, new_commit).replace(old_hash, new_hash)
          installer.write_text(text, encoding='utf-8', newline='\n')

          manifest = Path('manifests/versions.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          full = data['components']['dlss-full']
          if full.get('startup_prime_public_fix_commit') != old_commit:
              raise SystemExit('manifest old startup-prime commit mismatch')
          if full.get('startup_prime_public_fix_sha256', '').upper() != old_hash:
              raise SystemExit('manifest old startup-prime hash mismatch')
          full['startup_prime_public_fix_commit'] = new_commit
          full['startup_prime_public_fix_sha256'] = new_hash.lower()
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

      - name: Commit product pin update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/Install-DLSS-Full.bat manifests/versions.json
          if (git diff --cached --quiet) { throw 'No pin changes produced' }
          git commit -m "Repin hardened startup prime fix"
          git push origin HEAD:main
