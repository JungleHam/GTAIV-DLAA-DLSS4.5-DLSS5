name: M3K Feeder A3-S4 Manual Resolution

on:
  workflow_dispatch:
  push:
    branches:
      - gtaiv-m3k-a3-post-s2
    paths:
      - .github/workflows/m3k-feeder-a3-s4-manual-resolution.yml
      - tools/m3k-nr/a3-s4-manual-resolution-stage.ps1
      - tools/m3k-nr/build-a3-s4.ps1
      - tools/m3k-nr/a3-s3-balanced-isolation-stage.ps1
      - tools/m3k-nr/build-a3-s3.ps1
      - tools/m3k-nr/**

jobs:
  build-feeder-a3-s4:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Build A3-S4 manual-resolution Feeder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\m3k-nr\build-a3-s4.ps1
          Get-Content .\tools\m3k-nr\out-m3k-a3-s4\BUILD-VERIFIED.txt

      - name: Upload A3-S4 Feeder build
        uses: actions/upload-artifact@v7
        with:
          name: M3K-A3-S4-Manual-Resolution-x64
          path: tools/m3k-nr/out-m3k-a3-s4
          if-no-files-found: error
