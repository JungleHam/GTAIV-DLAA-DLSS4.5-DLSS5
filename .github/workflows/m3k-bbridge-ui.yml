name: M3K b-bridge A2-S2.1 UI

on:
  workflow_dispatch:
  push:
    branches: [ gtaiv-m3k-a2-sr-profiles ]
    paths:
      - 'tools/m3k-nr/a2-s21-bbridge-ui.py'
      - '.github/workflows/m3k-bbridge-ui.yml'

jobs:
  build-bbridge-ui:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone pinned b-bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tools/m3k-nr/_work | Out-Null
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git tools/m3k-nr/_work/bbridge-ui
          git -C tools/m3k-nr/_work/bbridge-ui checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C tools/m3k-nr/_work/bbridge-ui submodule update --init --recursive
          $head = git -C tools/m3k-nr/_work/bbridge-ui rev-parse HEAD
          if ($head -ne '1dad5e6d4dcf8647e354aa9a87f611256fb61142') { throw "Wrong b-bridge revision: $head" }

      - name: Apply M3K UI virtualization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/m3k-nr/a2-s21-bbridge-ui.py tools/m3k-nr/_work/bbridge-ui
          $src = Get-Content tools/m3k-nr/_work/bbridge-ui/src/client/window.cpp -Raw
          foreach ($marker in @('[M3K-UI] config','NewGetClientRect','DETOURS_ATTACH(GetClientRect)','forwarding WM_SIZE as logical')) {
            if (-not $src.Contains($marker)) { throw "Missing patch marker: $marker" }
          }
          git -C tools/m3k-nr/_work/bbridge-ui diff --check
          git -C tools/m3k-nr/_work/bbridge-ui diff -- src/client/window.cpp

      - name: Setup Meson
        run: pip install meson==0.64.1

      - name: Build matching release x64 + x86 bridge
        shell: pwsh
        working-directory: tools/m3k-nr/_work/bbridge-ui
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope Process
          .\build_bridge_release.bat
          if ($LASTEXITCODE -ne 0) { throw "b-bridge build failed: $LASTEXITCODE" }

      - name: Verify output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'tools/m3k-nr/_work/bbridge-ui/_output'
          if (-not (Test-Path "$out/d3d9.dll")) { throw 'Missing x86 client d3d9.dll' }
          if (-not (Test-Path "$out/.trex/NvRemixBridge.exe")) { throw 'Missing x64 NvRemixBridge.exe' }
          @(
            'M3K A2-S2.1 matching b-bridge pair',
            'Upstream b-bridge=1dad5e6d4dcf8647e354aa9a87f611256fb61142',
            'Patch=32-bit GetClientRect + WM_SIZE logical render-size virtualization',
            ((Get-FileHash -Algorithm SHA256 "$out/d3d9.dll").Hash + '  d3d9.dll'),
            ((Get-FileHash -Algorithm SHA256 "$out/.trex/NvRemixBridge.exe").Hash + '  .trex/NvRemixBridge.exe')
          ) | Set-Content "$out/M3K-UI-BUILD.txt"
          Get-Content "$out/M3K-UI-BUILD.txt"

      - name: Upload matching bridge pair
        uses: actions/upload-artifact@v4
        with:
          name: M3K-A2-S2.1-bbridge-ui
          include-hidden-files: true
          path: |
            tools/m3k-nr/_work/bbridge-ui/_output/d3d9.dll
            tools/m3k-nr/_work/bbridge-ui/_output/.trex/NvRemixBridge.exe
            tools/m3k-nr/_work/bbridge-ui/_output/M3K-UI-BUILD.txt
