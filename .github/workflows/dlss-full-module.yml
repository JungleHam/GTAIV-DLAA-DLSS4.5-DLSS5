name: DLSS 4.5 SR + DLSS 5 NR Module Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/Install-DLSS-Full.bat'
      - 'install/DLSS-Full-Control.bat'
      - 'install/Public-ReShade-Controls-Stage.ps1'
      - 'docs/DLSS-FULL.md'
      - 'docs/DLSS5.md'
      - 'README.md'
      - 'install/README.md'
      - 'input/README.md'
      - 'manifests/versions.json'
      - '.github/workflows/dlss-full-module.yml'

jobs:
  validate-dlss-full:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout public module
        uses: actions/checkout@v4

      - name: Static combined-module checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          $control = Get-Content install/DLSS-Full-Control.bat -Raw
          $uiStage = Get-Content install/Public-ReShade-Controls-Stage.ps1 -Raw
          $manifest = Get-Content manifests/versions.json -Raw | ConvertFrom-Json

          foreach ($marker in @(
            '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f',
            '1dad5e6d4dcf8647e354aa9a87f611256fb61142',
            '6DD40F145A5D503624E3E05ECF0ADBAA094CF83B24278C0BB333318E3C52A912',
            'C73D8D54271F55F8931F00D62A4CDF605118BEA71D7C6BEE0B61D0CA7C1CCE4B',
            'A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC',
            '6d31f05862eeb51f05e86455696c0838d4f62a71',
            'D0EA12FC652C21FD2D7FC7F56DF1F7703F361226BD5D26A26C6A9AAB3579D1C1',
            'https://github.com/RankFTW/rhi-repo/releases/download/dlssnr-310.8.0-RTX40/nvngx_dlssnr_310.8.0-RTX40.zip',
            '46124CFAEF532AD5F6DA07494772EA8C1B3E719F934E254385697F38D1289E3F',
            '4B8D19BC3EFF58A084F5ECA7489C921501C203450169FB82FF4F649A4482BA05',
            'StartupPrimeWidth=1485',
            'StartupPrimeHeight=835',
            'StartupPrimeFrames=180',
            'Mode=0',
            'NRPasses=1',
            'Home -> Add-ons -> DLSS 5 Feed -> GTA IV DLSS')) {
            if (-not $installer.Contains($marker)) { throw "Installer missing marker: $marker" }
          }

          foreach ($marker in @(
            'function Prepare-StartupStabilization',
            'function Show-Status',
            'function Repair-StartupStabilization',
            'function Open-DiagnosticLog',
            "Set-Ini 'RenderWidth' '1485'",
            "Set-Ini 'RenderHeight' '835'",
            "Set-Ini 'StartupPrimeFrames' '180'",
            'Home -> Add-ons -> DLSS 5 Feed -> GTA IV DLSS')) {
            if (-not $control.Contains($marker)) { throw "Tools helper missing marker: $marker" }
          }
          foreach ($forbidden in @('function Set-DlssQuality','function Set-NeuralRendering','[N] Turn Neural Rendering','[O] Turn Neural Rendering')) {
            if ($control.Contains($forbidden)) { throw "Tools helper still duplicates ReShade settings: $forbidden" }
          }

          foreach ($marker in @(
            'M3kRequestNrEnabledLive',
            'GTA IV DLSS',
            'Neural Rendering##M3KNrEnabled',
            'Neural Rendering passes (advanced)',
            '1 pass is the tested public default',
            'DLSS Super Resolution quality',
            'Custom Ultra Quality (77%)')) {
            if (-not $uiStage.Contains($marker)) { throw "Public ReShade controls stage missing marker: $marker" }
          }

          $full = $manifest.components.'dlss-full'
          if ($full.project_checkpoint -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw 'Manifest checkpoint mismatch' }
          if ($full.nr_default_mode -ne 0 -or $full.nr_enabled_mode -ne 2 -or $full.nr_passes -ne 1) { throw 'Manifest NR mode contract mismatch' }
          if ($full.public_reshade_controls_commit -ne '6d31f05862eeb51f05e86455696c0838d4f62a71') { throw 'Manifest public ReShade controls commit mismatch' }
          if ($full.public_reshade_controls_sha256.ToUpperInvariant() -ne 'D0EA12FC652C21FD2D7FC7F56DF1F7703F361226BD5D26A26C6A9AAB3579D1C1') { throw 'Manifest public ReShade controls hash mismatch' }
          if ($full.a3s2_reference_d3d9_sha256.ToUpperInvariant() -ne '6DD40F145A5D503624E3E05ECF0ADBAA094CF83B24278C0BB333318E3C52A912') { throw 'Manifest temporal-sync reference hash mismatch' }
          if ($full.a3s5_reference_feeder_sha256.ToUpperInvariant() -ne 'C73D8D54271F55F8931F00D62A4CDF605118BEA71D7C6BEE0B61D0CA7C1CCE4B') { throw 'Manifest pre-UI Feeder reference hash mismatch' }
          if ($full.s27_reference_shim_sha256.ToUpperInvariant() -ne 'A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC') { throw 'Manifest shim reference hash mismatch' }

          $nr = $manifest.components.nvngx_dlssnr
          if ($nr.package_sha256.ToUpperInvariant() -ne '46124CFAEF532AD5F6DA07494772EA8C1B3E719F934E254385697F38D1289E3F') { throw 'Manifest NR package hash mismatch' }
          if ($nr.dll_sha256.ToUpperInvariant() -ne '4B8D19BC3EFF58A084F5ECA7489C921501C203450169FB82FF4F649A4482BA05') { throw 'Manifest NR DLL hash mismatch' }
          if (-not $nr.installed_automatically -or $nr.default_enabled) { throw 'Manifest NR install/default state mismatch' }

          if ($manifest.components.PSObject.Properties.Name -contains 'deep-fried-chicken') { throw 'Legacy DFC component is still present in manifest' }
          Write-Host 'Static combined-module checks passed.'

      - name: Checkout frozen startup-stabilization source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _verify_project
          git -C _verify_project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          $head = git -C _verify_project rev-parse HEAD
          if ($head.Trim() -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw "Wrong frozen project revision: $head" }

      - name: Attach public ReShade controls stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item .\install\Public-ReShade-Controls-Stage.ps1 .\_verify_project\tools\m3k-nr\public-reshade-controls-stage.ps1 -Force
          $build = '.\_verify_project\tools\m3k-nr\build-a3-s5.ps1'
          $text = [IO.File]::ReadAllText($build)
          $anchor = @'
          & (Join-Path $toolRoot 'a3-s5-startup-prime-stage.ps1') -GeneratedRoot $generated
          '@
          $replacement = @'
          & (Join-Path $toolRoot 'a3-s5-startup-prime-stage.ps1') -GeneratedRoot $generated
          & (Join-Path $toolRoot 'public-reshade-controls-stage.ps1') -GeneratedRoot $generated -FeederSource (Join-Path $feeder 'src\dlss5-feed.cpp')
          '@
          $count = ([regex]::Matches($text,[regex]::Escape($anchor))).Count
          if ($count -ne 1) { throw "Could not attach public controls stage; anchor count=$count" }
          [IO.File]::WriteAllText($build,$text.Replace($anchor,$replacement),(New-Object Text.UTF8Encoding($false)))

      - name: Build and test combined Feeder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\_verify_project\tools\m3k-nr\build-a3-s5.ps1
          if ($LASTEXITCODE -ne 0) { throw "Combined Feeder build failed: $LASTEXITCODE" }
          $feeder = '.\_verify_project\tools\m3k-nr\out-m3k-a3-s5\dlss5-feed.addon64'
          $shim = '.\_verify_project\tools\m3k-nr\out-m3k-s27\m3k\m3k-nvngx.dll'
          if (-not (Test-Path $feeder)) { throw 'Missing combined Feeder output' }
          if (-not (Test-Path $shim)) { throw 'Missing integration shim output' }

          $generatedVk = Get-Content .\_verify_project\tools\m3k-nr\_work\m3k-src-a3-s5\m3k_vk.h -Raw
          $generatedFeed = Get-Content .\_verify_project\tools\m3k-nr\_work\feeder\src\dlss5-feed.cpp -Raw
          foreach ($marker in @('M3kRequestNrEnabledLive','GTA IV DLSS','Neural Rendering##M3KNrEnabled','DLSS Super Resolution quality','Custom Ultra Quality (77%)')) {
            if (-not (($generatedVk + $generatedFeed).Contains($marker))) { throw "Generated public UI marker missing: $marker" }
          }

          $fh = (Get-FileHash -Algorithm SHA256 $feeder).Hash
          $sh = (Get-FileHash -Algorithm SHA256 $shim).Hash
          Write-Host "Current runner combined Feeder:          $fh"
          Write-Host "Pre-UI hardware-reference Feeder:        C73D8D54271F55F8931F00D62A4CDF605118BEA71D7C6BEE0B61D0CA7C1CCE4B"
          Write-Host "Current runner integration shim:         $sh"
          Write-Host "Hardware-reference shim:                 A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC"
          Write-Host 'The Feeder is expected to differ from the pre-UI reference because user-facing ReShade controls are now compiled into it.' -ForegroundColor Yellow
          if ($sh -ne 'A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC') {
            Write-Host 'Shim PE hash differs from the hardware-tested CI image; frozen source build and CPU tests still passed.' -ForegroundColor Yellow
          }

      - name: Clone and patch temporal-synchronization bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git _verify_bbridge
          git -C _verify_bbridge checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C _verify_bbridge submodule update --init --recursive
          $head = git -C _verify_bbridge rev-parse HEAD
          if ($head.Trim() -ne '1dad5e6d4dcf8647e354aa9a87f611256fb61142') { throw "Wrong b-bridge revision: $head" }
          python .\_verify_project\tools\m3k-nr\a2-s21-bbridge-ui.py .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'UI patch failed' }
          python .\_verify_project\tools\m3k-nr\a3-s2-bbridge-coherent-draw-jitter.py .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'Temporal-synchronization patch failed' }
          git -C _verify_bbridge diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched b-bridge diff check failed' }
          $device = Get-Content .\_verify_bbridge\src\client\d3d9_device.cpp -Raw
          $swap = Get-Content .\_verify_bbridge\src\client\d3d9_swapchain.cpp -Raw
          foreach ($marker in @('M3K_SYNC_WVP_FOR_DRAW','[M3K-JITTER2] DRAW','[M3K-JITTER2] RESTORE','M3K_GTAIV_Jitter_v1')) {
            if (-not $device.Contains($marker)) { throw "Temporal-sync source marker missing: $marker" }
          }
          if (($device.Split('M3K_SYNC_WVP_FOR_DRAW();').Count - 1) -ne 4) { throw 'Expected exactly four synchronized D3D9 draw paths' }
          foreach ($marker in @('M3kJitterPublishPresent','M3kJitterAdvanceAfterPresent')) {
            if (-not $swap.Contains($marker)) { throw "Temporal-sync Present marker missing: $marker" }
          }

      - name: Setup pinned Meson
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check meson==0.64.1 ninja==1.11.1.1

      - name: Build temporal-synchronization x86 bridge
        shell: pwsh
        working-directory: _verify_bbridge
        run: |
          $ErrorActionPreference = 'Stop'
          . .\build_common.ps1
          SetupVS -Platform x86
          meson setup --buildtype release --backend ninja _compVerify --debug
          if ($LASTEXITCODE -ne 0) { throw "Meson setup failed: $LASTEXITCODE" }
          Copy-Item .\Directory.Build.Props -Destination .\_compVerify -Force
          meson compile -C _compVerify d3d9
          if ($LASTEXITCODE -ne 0) { throw "d3d9 build failed: $LASTEXITCODE" }
          $bridge = '.\_compVerify\src\client\d3d9.dll'
          if (-not (Test-Path $bridge)) { throw 'Missing temporal-synchronization d3d9.dll' }
          $bh = (Get-FileHash -Algorithm SHA256 $bridge).Hash
          Write-Host "Current runner temporal-sync bridge: $bh"
          Write-Host 'Hardware-reference bridge:           6DD40F145A5D503624E3E05ECF0ADBAA094CF83B24278C0BB333318E3C52A912'
          if ($bh -ne '6DD40F145A5D503624E3E05ECF0ADBAA094CF83B24278C0BB333318E3C52A912') {
            Write-Host 'Bridge PE hash differs from the hardware-tested CI image; frozen source/patch/build validation still passed.' -ForegroundColor Yellow
          }

      - name: Module validation summary
        shell: pwsh
        run: |
          Write-Host 'Combined module validated: ReShade is the single normal settings surface; public NR toggle/quality UI compiled successfully; frozen rendering core passed CPU tests; temporal-synchronization bridge built successfully.' -ForegroundColor Green
          Write-Host 'DLSS-Full-Control.bat is limited to launch, repair, status, and diagnostics.' -ForegroundColor Green
