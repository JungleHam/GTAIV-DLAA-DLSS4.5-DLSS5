name: DLSS 4.5 SR + DLSS 5 NR Module Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/Install-DLSS-Full.bat'
      - 'install/DLSS-Full-Control.bat'
      - 'install/Uninstall-DLSS-Full.bat'
      - 'install/Public-ReShade-Controls-Stage.ps1'
      - 'install/Public-Startup-Prime-Fix-Stage.ps1'
      - 'install/Public-ReShade-UX-Master-Stage.ps1'
      - 'install/Public-ReShade-UX-Master-Fixup.ps1'
      - 'install/Public-ReShade-UX-Master-V2-Fixup.ps1'
      - 'docs/DLSS-FULL.md'
      - 'docs/DLSS5.md'
      - 'README.md'
      - 'install/README.md'
      - 'input/README.md'
      - 'manifests/versions.json'
      - '.github/workflows/dlss-full-module.yml'

jobs:
  validate-dlss-full:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout public module
        uses: actions/checkout@v4

      - name: Static production checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          $control = Get-Content install/DLSS-Full-Control.bat -Raw
          $uninstaller = Get-Content install/Uninstall-DLSS-Full.bat -Raw
          $uiStage = Get-Content install/Public-ReShade-Controls-Stage.ps1 -Raw
          $uxStage = Get-Content install/Public-ReShade-UX-Master-Stage.ps1 -Raw
          $uxFix = Get-Content install/Public-ReShade-UX-Master-Fixup.ps1 -Raw
          $uxV2 = Get-Content install/Public-ReShade-UX-Master-V2-Fixup.ps1 -Raw
          $manifest = Get-Content manifests/versions.json -Raw | ConvertFrom-Json

          $publicControlsCommit = '11ac957138d4c6376d1e6ee6413f32cf9826b422'
          $publicControlsHash = '0C602D710F62EB6DF15C86B7B5473A7F3E9F2E1CF3270AEA3976EA512F5907A3'
          $startupPrimeCommit = '12ae20c8789495064b32a3e0bf71072796fd46dc'
          $startupPrimeHash = '639856C7AFBD5BBE7BC46A38E839BA8EC95D912EFE7190975315045DBB5313BF'
          $publicUxCommit = 'ddc95ef594a960820a70eee37767a2fc9583fb90'
          $uxMasterBlob = '6e0ad36221acb4ff9ca35a0501daa0c4eb45b5b2'
          $uxFixBlob = 'f8b3a05b24ab912d643ec3661aa060b4257da7ee'
          $uxV2Blob = '9a079d97391ca70b1ab0a115e3c04288720e9d48'
          $publicUxReferenceFeeder = 'E22DD7EAF6D1C6A876AF486C939E3DCB980D6AE03A247B2C5772D0502224FCCD'
          $uninstallerCommit = 'e4c600a96e1b3682d7004dbd04dffc1abace7b90'
          $uninstallerHash = '0AF505444E966FB61AB9C83EB7F4D8874A436E4302AB935CAA2DBA0039656733'

          $uiRaw = Join-Path $env:RUNNER_TEMP 'Public-ReShade-Controls-Stage.raw.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$publicControlsCommit/install/Public-ReShade-Controls-Stage.ps1" -OutFile $uiRaw
          if ((Get-FileHash -Algorithm SHA256 $uiRaw).Hash.ToUpperInvariant() -ne $publicControlsHash) { throw 'Raw public controls hash mismatch' }

          $primeRaw = Join-Path $env:RUNNER_TEMP 'Public-Startup-Prime-Fix-Stage.raw.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$startupPrimeCommit/install/Public-Startup-Prime-Fix-Stage.ps1" -OutFile $primeRaw
          if ((Get-FileHash -Algorithm SHA256 $primeRaw).Hash.ToUpperInvariant() -ne $startupPrimeHash) { throw 'Raw startup-prime fix hash mismatch' }

          $uxFiles = @(
            @{ Name='Public-ReShade-UX-Master-Stage.ps1'; Blob=$uxMasterBlob },
            @{ Name='Public-ReShade-UX-Master-Fixup.ps1'; Blob=$uxFixBlob },
            @{ Name='Public-ReShade-UX-Master-V2-Fixup.ps1'; Blob=$uxV2Blob }
          )
          foreach ($item in $uxFiles) {
            $raw = Join-Path $env:RUNNER_TEMP $item.Name
            Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$publicUxCommit/install/$($item.Name)" -OutFile $raw
            $blob = (git hash-object -- $raw).Trim().ToLowerInvariant()
            if ($blob -ne $item.Blob) { throw "Pinned UX stage blob mismatch for $($item.Name): $blob" }
          }

          $uninstallRaw = Join-Path $env:RUNNER_TEMP 'Uninstall-DLSS-Full.raw.bat'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$uninstallerCommit/install/Uninstall-DLSS-Full.bat" -OutFile $uninstallRaw
          if ((Get-FileHash -Algorithm SHA256 $uninstallRaw).Hash.ToUpperInvariant() -ne $uninstallerHash) { throw 'Raw uninstaller hash mismatch' }

          foreach ($marker in @(
            '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f',
            '1dad5e6d4dcf8647e354aa9a87f611256fb61142',
            '6DD40F145A5D503624E3E05ECF0ADBAA094CF83B24278C0BB333318E3C52A912',
            'C73D8D54271F55F8931F00D62A4CDF605118BEA71D7C6BEE0B61D0CA7C1CCE4B',
            'A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC',
            $publicControlsCommit,
            $publicControlsHash,
            $startupPrimeCommit,
            $startupPrimeHash,
            $publicUxCommit,
            $uxMasterBlob,
            $uxFixBlob,
            $uxV2Blob,
            $publicUxReferenceFeeder,
            $uninstallerCommit,
            $uninstallerHash,
            '_DLSS_FULL_DLAA_BASELINE',
            'Save-DlaaBaselineIfPossible',
            'Uninstall-DLSS-Full.bat',
            'MasterEnabled=1',
            'LastSRProfile=',
            'LastNRMode=0',
            'StartupPrimeWidth=1485',
            'StartupPrimeHeight=835',
            'StartupPrimeFrames=180',
            'NRPasses=1',
            'public-reshade-ux-master-v2-fixup.ps1',
            'Home -> Add-ons -> DLSS 5 Feed -> GTA IV DLSS')) {
            if (-not $installer.Contains($marker)) { throw "Installer missing marker: $marker" }
          }

          foreach ($marker in @(
            'function Prepare-StartupStabilization',
            'function Show-Status',
            'function Repair-StartupStabilization',
            'function Open-DiagnosticLog',
            "Set-Ini 'RenderWidth' '1485'",
            "Set-Ini 'RenderHeight' '835'",
            "Set-Ini 'StartupPrimeFrames' '180'",
            'Home -> Add-ons -> DLSS 5 Feed -> GTA IV DLSS')) {
            if (-not $control.Contains($marker)) { throw "Tools helper missing marker: $marker" }
          }
          foreach ($forbidden in @('function Set-DlssQuality','function Set-NeuralRendering','[N] Turn Neural Rendering','[O] Turn Neural Rendering')) {
            if ($control.Contains($forbidden)) { throw "Tools helper still duplicates ReShade settings: $forbidden" }
          }

          foreach ($marker in @('M3kRequestNrEnabledLive','GTA IV DLSS','DLAA Native','Custom Ultra Quality (77%)','Mode##M3KSRProfile')) {
            if (-not $uiStage.Contains($marker)) { throw "Public ReShade controls stage missing marker: $marker" }
          }
          foreach ($marker in @('DLSS / DLAA processing##M3KMaster','Advanced##M3KAdvanced','Diagnostics##M3KDiagnostics','ImGuiCond_Appearing','M3K-MASTER: OFF ACTIVE')) {
            if (-not $uxStage.Contains($marker)) { throw "UX/master stage missing marker: $marker" }
          }
          if (-not $uxFix.Contains('Active passes: %u')) { throw 'UX/master public fixup missing' }
          foreach ($marker in @('M3K-MASTER-V2: OFF stage 1','M3K-MASTER-V2: OFF stage 2','M3K-MASTER-V2: OFF ACTIVE','master OFF is not carried across launches','M3kAdvanceMasterDisable();')) {
            if (-not $uxV2.Contains($marker)) { throw "UX/master v2 fixup missing marker: $marker" }
          }

          foreach ($marker in @(
            'UNINSTALL DLSS FULL -> RESTORE DLAA BASELINE',
            '_DLSS_FULL_DLAA_BASELINE',
            '_DLSS_FULL_PREINSTALL_BACKUP_',
            '_DLSS_FULL_UNINSTALL_SAFETY_',
            'Test-DlaaBaseline',
            'DLAA-only runtime restored',
            'ReShade input patch')) {
            if (-not $uninstaller.Contains($marker)) { throw "Uninstaller missing marker: $marker" }
          }
          if ($uninstaller.Contains("Remove-Item -LiteralPath `$Trex -Recurse")) { throw 'Uninstaller must not delete the whole .trex tree' }

          $full = $manifest.components.'dlss-full'
          if ($full.project_checkpoint -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw 'Manifest checkpoint mismatch' }
          if ($full.nr_default_mode -ne 0 -or $full.nr_enabled_mode -ne 2 -or $full.nr_passes -ne 1) { throw 'Manifest NR mode contract mismatch' }
          if ($full.public_reshade_controls_commit -ne $publicControlsCommit) { throw 'Manifest public controls commit mismatch' }
          if ($full.public_reshade_controls_sha256.ToUpperInvariant() -ne $publicControlsHash) { throw 'Manifest public controls hash mismatch' }
          if ($full.startup_prime_public_fix_commit -ne $startupPrimeCommit) { throw 'Manifest startup-prime fix commit mismatch' }
          if ($full.startup_prime_public_fix_sha256.ToUpperInvariant() -ne $startupPrimeHash) { throw 'Manifest startup-prime fix hash mismatch' }
          if ($full.public_reshade_ux_commit -ne $publicUxCommit) { throw 'Manifest public UX commit mismatch' }
          if ($full.public_reshade_ux_master_stage_blob -ne $uxMasterBlob) { throw 'Manifest UX master blob mismatch' }
          if ($full.public_reshade_ux_fixup_blob -ne $uxFixBlob) { throw 'Manifest UX fixup blob mismatch' }
          if ($full.public_reshade_ux_v2_fixup_blob -ne $uxV2Blob) { throw 'Manifest UX v2 blob mismatch' }
          if ($full.public_reshade_ux_reference_feeder_sha256.ToUpperInvariant() -ne $publicUxReferenceFeeder) { throw 'Manifest UX reference Feeder mismatch' }
          if ($full.master_processing_default -ne $true -or $full.master_processing_off_scope -ne 'session-only') { throw 'Manifest master-processing contract mismatch' }
          if ($full.uninstaller_commit -ne $uninstallerCommit) { throw 'Manifest uninstaller commit mismatch' }
          if ($full.uninstaller_sha256.ToUpperInvariant() -ne $uninstallerHash) { throw 'Manifest uninstaller hash mismatch' }
          if (($full.public_modes | Measure-Object).Count -ne 6 -or $full.public_modes[0] -ne 'DLAA Native') { throw 'Manifest public mode list mismatch' }
          if ($full.a3s2_reference_d3d9_sha256.ToUpperInvariant() -ne '6DD40F145A5D503624E3E05ECF0ADBAA094CF83B24278C0BB333318E3C52A912') { throw 'Manifest temporal-sync reference hash mismatch' }
          if ($full.a3s5_reference_feeder_sha256.ToUpperInvariant() -ne 'C73D8D54271F55F8931F00D62A4CDF605118BEA71D7C6BEE0B61D0CA7C1CCE4B') { throw 'Manifest pre-UI Feeder reference hash mismatch' }
          if ($full.s27_reference_shim_sha256.ToUpperInvariant() -ne 'A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC') { throw 'Manifest shim reference hash mismatch' }
          if ($manifest.components.PSObject.Properties.Name -contains 'deep-fried-chicken') { throw 'Legacy DFC component is still present in manifest' }
          Write-Host 'Static production checks passed.'

      - name: Checkout frozen rendering source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _verify_project
          git -C _verify_project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          if ((git -C _verify_project rev-parse HEAD).Trim() -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw 'Wrong frozen project revision' }

      - name: Attach pinned production release stages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = '.\_verify_project\tools\m3k-nr'

          $controlsCommit = '11ac957138d4c6376d1e6ee6413f32cf9826b422'
          $controlsExpected = '0C602D710F62EB6DF15C86B7B5473A7F3E9F2E1CF3270AEA3976EA512F5907A3'
          $controlsRaw = Join-Path $env:RUNNER_TEMP 'Public-ReShade-Controls-Stage.build.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$controlsCommit/install/Public-ReShade-Controls-Stage.ps1" -OutFile $controlsRaw
          if ((Get-FileHash -Algorithm SHA256 $controlsRaw).Hash.ToUpperInvariant() -ne $controlsExpected) { throw 'Pinned controls stage hash mismatch' }
          Copy-Item $controlsRaw "$tool\public-reshade-controls-stage.ps1" -Force

          $primeCommit = '12ae20c8789495064b32a3e0bf71072796fd46dc'
          $primeExpected = '639856C7AFBD5BBE7BC46A38E839BA8EC95D912EFE7190975315045DBB5313BF'
          $primeRaw = Join-Path $env:RUNNER_TEMP 'Public-Startup-Prime-Fix-Stage.build.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$primeCommit/install/Public-Startup-Prime-Fix-Stage.ps1" -OutFile $primeRaw
          if ((Get-FileHash -Algorithm SHA256 $primeRaw).Hash.ToUpperInvariant() -ne $primeExpected) { throw 'Pinned startup-prime fix hash mismatch' }
          Copy-Item $primeRaw "$tool\public-startup-prime-fix-stage.ps1" -Force

          $uxCommit = 'ddc95ef594a960820a70eee37767a2fc9583fb90'
          $uxFiles = @(
            @{ Name='Public-ReShade-UX-Master-Stage.ps1'; Dest='public-reshade-ux-master-stage.ps1'; Blob='6e0ad36221acb4ff9ca35a0501daa0c4eb45b5b2' },
            @{ Name='Public-ReShade-UX-Master-Fixup.ps1'; Dest='public-reshade-ux-master-fixup.ps1'; Blob='f8b3a05b24ab912d643ec3661aa060b4257da7ee' },
            @{ Name='Public-ReShade-UX-Master-V2-Fixup.ps1'; Dest='public-reshade-ux-master-v2-fixup.ps1'; Blob='9a079d97391ca70b1ab0a115e3c04288720e9d48' }
          )
          foreach ($item in $uxFiles) {
            $raw = Join-Path $env:RUNNER_TEMP ("build-" + $item.Name)
            Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$uxCommit/install/$($item.Name)" -OutFile $raw
            $blob = (git hash-object -- $raw).Trim().ToLowerInvariant()
            if ($blob -ne $item.Blob) { throw "Pinned UX stage blob mismatch for $($item.Name): $blob" }
            Copy-Item $raw (Join-Path $tool $item.Dest) -Force
          }

          $build = "$tool\build-a3-s5.ps1"
          $text = [IO.File]::ReadAllText($build)
          $anchor = "& (Join-Path `$toolRoot 'a3-s5-startup-prime-stage.ps1') -GeneratedRoot `$generated"
          $lines = @(
            $anchor,
            "& (Join-Path `$toolRoot 'public-reshade-controls-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-startup-prime-fix-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-reshade-ux-master-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-reshade-ux-master-fixup.ps1') -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-reshade-ux-master-v2-fixup.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')"
          )
          $replacement = $lines -join "`r`n"
          if (($text.Split($anchor).Count - 1) -ne 1) { throw 'Could not attach production release stages exactly once' }
          [IO.File]::WriteAllText($build,$text.Replace($anchor,$replacement),[Text.UTF8Encoding]::new($false))

      - name: Build and test production Feeder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\_verify_project\tools\m3k-nr\build-a3-s5.ps1
          if ($LASTEXITCODE -ne 0) { throw "Production Feeder build failed: $LASTEXITCODE" }
          $feeder = '.\_verify_project\tools\m3k-nr\out-m3k-a3-s5\dlss5-feed.addon64'
          $shim = '.\_verify_project\tools\m3k-nr\out-m3k-s27\m3k\m3k-nvngx.dll'
          if (-not (Test-Path $feeder) -or -not (Test-Path $shim)) { throw 'Combined runtime output missing' }

          $generatedVk = Get-Content .\_verify_project\tools\m3k-nr\_work\m3k-src-a3-s5\m3k_vk.h -Raw
          $generatedFeed = Get-Content .\_verify_project\tools\m3k-nr\_work\feeder\src\dlss5-feed.cpp -Raw
          foreach ($marker in @(
            'DLSS / DLAA processing##M3KMaster',
            'DLAA Native',
            'Custom Ultra Quality (77%)',
            'Advanced##M3KAdvanced',
            'Diagnostics##M3KDiagnostics',
            'M3K-MASTER-V2: OFF stage 1',
            'M3K-MASTER-V2: OFF stage 2',
            'M3K-MASTER-V2: OFF ACTIVE',
            'master OFF is not carried across launches',
            'M3kAdvanceMasterDisable();',
            'M3K-A3-S5: startup prime cancelled by live profile change')) {
            if (-not (($generatedVk + $generatedFeed).Contains($marker))) { throw "Generated production marker missing: $marker" }
          }
          if ($generatedVk.Contains('persistent state=OFF saved reconstruction=')) { throw 'Rejected v1 persistent-OFF behavior survived production v2 fixup' }
          if ($generatedFeed.Contains('reshade::register_overlay("M3K Capture Lab"') -or $generatedFeed.Contains('reshade::unregister_overlay("M3K Capture Lab"')) { throw 'Generated public Feeder still registers M3K Capture Lab' }

          $feederHash = (Get-FileHash -Algorithm SHA256 $feeder).Hash.ToUpperInvariant()
          Write-Host "Production Feeder SHA256: $feederHash"
          if ($feederHash -eq 'E22DD7EAF6D1C6A876AF486C939E3DCB980D6AE03A247B2C5772D0502224FCCD') {
            Write-Host 'Feeder byte-matches the hardware-tested UX/master v2 reference build.' -ForegroundColor Green
          } else {
            Write-Host 'Feeder PE hash differs from the hardware reference; pinned source/stage validation passed (compiler/build timestamp may differ).' -ForegroundColor Yellow
          }

          $sh = (Get-FileHash -Algorithm SHA256 $shim).Hash.ToUpperInvariant()
          if ($sh -ne 'A2E4BEDACE8D99BC60B5D18E958BD7E98F8887FF40EC45A8674B892E2D1FCBBC') { Write-Host 'Shim PE hash differs on this runner; frozen source + CPU tests passed.' -ForegroundColor Yellow }
          Write-Host 'Production Feeder/UX build passed.' -ForegroundColor Green

      - name: Clone and patch temporal-synchronization bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git _verify_bbridge
          git -C _verify_bbridge checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C _verify_bbridge submodule update --init --recursive
          python .\_verify_project\tools\m3k-nr\a2-s21-bbridge-ui.py .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'UI virtualization patch failed' }
          python .\_verify_project\tools\m3k-nr\a3-s2-bbridge-coherent-draw-jitter.py .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'Temporal-synchronization patch failed' }
          git -C _verify_bbridge diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched b-bridge diff check failed' }
          $device = Get-Content .\_verify_bbridge\src\client\d3d9_device.cpp -Raw
          $swap = Get-Content .\_verify_bbridge\src\client\d3d9_swapchain.cpp -Raw
          foreach ($marker in @('M3K_SYNC_WVP_FOR_DRAW','[M3K-JITTER2] DRAW','[M3K-JITTER2] RESTORE','M3K_GTAIV_Jitter_v1')) { if (-not $device.Contains($marker)) { throw "Temporal-sync source marker missing: $marker" } }
          if (($device.Split('M3K_SYNC_WVP_FOR_DRAW();').Count - 1) -ne 4) { throw 'Expected exactly four synchronized D3D9 draw paths' }
          foreach ($marker in @('M3kJitterPublishPresent','M3kJitterAdvanceAfterPresent')) { if (-not $swap.Contains($marker)) { throw "Temporal-sync Present marker missing: $marker" } }

      - name: Setup pinned Meson
        shell: pwsh
        run: python -m pip install --disable-pip-version-check meson==0.64.1 ninja==1.11.1.1

      - name: Build temporal-synchronization bridge pair
        shell: pwsh
        working-directory: _verify_bbridge
        run: |
          $ErrorActionPreference = 'Stop'
          . .\build_common.ps1
          SetupVS -Platform x86
          meson setup --buildtype release --backend ninja _compVerify32 --debug
          Copy-Item .\Directory.Build.Props -Destination .\_compVerify32 -Force
          meson compile -C _compVerify32 d3d9
          if ($LASTEXITCODE -ne 0) { throw 'x86 d3d9 build failed' }
          SetupVS -Platform x64
          meson setup --buildtype release --backend ninja _compVerify64 --debug
          Copy-Item .\Directory.Build.Props -Destination .\_compVerify64 -Force
          meson compile -C _compVerify64 NvRemixBridge
          if ($LASTEXITCODE -ne 0) { throw 'x64 NvRemixBridge build failed' }
          if (-not (Test-Path .\_compVerify32\src\client\d3d9.dll)) { throw 'Missing x86 bridge output' }
          if (-not (Test-Path .\_compVerify64\src\server\NvRemixBridge.exe)) { throw 'Missing x64 bridge output' }

      - name: Module validation summary
        shell: pwsh
        run: |
          Write-Host 'Validated: hardware-tested ReShade UX/master v2, staged session-only raw bypass, six-mode DLAA/DLSS panel, NR controls, startup-prime restoration, diagnostics, pinned uninstaller, DLAA rollback contract, frozen Feeder/shim core, and matched x86/x64 temporal bridge builds.' -ForegroundColor Green
