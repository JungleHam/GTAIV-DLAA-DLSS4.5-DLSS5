name: Fix Final Public Stage Verification ID

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-final-public-stage-id.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix stage, repin installer and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stagePath = 'install/Public-ReShade-Controls-Stage.ps1'
          $stage = [IO.File]::ReadAllText($stagePath)
          $old = "'Quality##M3KSRProfile'"
          $new = "'Mode##M3KSRProfile'"
          if (($stage.Split($old).Count - 1) -ne 1) { throw 'Expected exactly one old combo verification id' }
          [IO.File]::WriteAllText($stagePath,$stage.Replace($old,$new),[Text.UTF8Encoding]::new($false))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $stagePath
          git commit -m 'Fix public panel combo verification id'
          $contentCommit = (git rev-parse HEAD).Trim()
          $stageHash = (python -c "import subprocess,hashlib; b=subprocess.check_output(['git','show','$contentCommit`:install/Public-ReShade-Controls-Stage.ps1']); print(hashlib.sha256(b).hexdigest().upper())").Trim()
          Write-Host "PUBLIC_CONTROLS_COMMIT=$contentCommit"
          Write-Host "PUBLIC_CONTROLS_SHA256=$stageHash"

          $installerPath = 'install/Install-DLSS-Full.bat'
          $installer = [IO.File]::ReadAllText($installerPath)
          $installer = $installer.Replace("$" + "PublicControlsCommit = 'd65fb6c9df2e6206015bad53c24f96a75c2d10e0'", "$" + "PublicControlsCommit = '$contentCommit'")
          $installer = $installer.Replace("$" + "PublicControlsHash = '60F87F81DE0B7E78DF582223233524362FD98C2907C0EBFD38082C615269E827'", "$" + "PublicControlsHash = '$stageHash'")
          if (-not $installer.Contains("$" + "PublicControlsCommit = '$contentCommit'")) { throw 'Installer commit repin failed' }
          if (-not $installer.Contains("$" + "PublicControlsHash = '$stageHash'")) { throw 'Installer hash repin failed' }
          [IO.File]::WriteAllText($installerPath,$installer,[Text.UTF8Encoding]::new($false))

          $manifestPath = 'manifests/versions.json'
          $m = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $m.components.'dlss-full'.public_reshade_controls_commit = $contentCommit
          $m.components.'dlss-full'.public_reshade_controls_sha256 = $stageHash.ToLowerInvariant()
          $m | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          git diff --check
          git add $installerPath $manifestPath
          git commit -m 'Repin corrected final public controls stage'
          git push origin HEAD:main
