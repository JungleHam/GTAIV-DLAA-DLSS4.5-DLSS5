name: Build cleaned prebuilt runtime artifacts
# Feature-branch validation refresh: custom scale + NR tuning v3

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/dlss-custom-scale-nr-controls ]
    paths:
      - '.github/workflows/prebuilt-runtime-release.yml'

permissions:
  contents: read

jobs:
  build-presenter:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install DXVK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 meson ninja-build glslang-tools

      - name: Clone frozen project and exact DXVK 3.0.2 source
        run: |
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _project
          git -C _project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          test "$(git -C _project rev-parse HEAD)" = "57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f"

          git clone --recursive https://github.com/doitsujin/dxvk.git _dxvk
          git -C _dxvk checkout 6b20f622a77b87b2921fe5d2c1774d2f2ba3e9b7
          git -C _dxvk submodule update --init --recursive
          test "$(git -C _dxvk rev-parse HEAD)" = "6b20f622a77b87b2921fe5d2c1774d2f2ba3e9b7"

      - name: Apply frozen M3K presenter patches
        run: |
          git -C _dxvk apply "$GITHUB_WORKSPACE/_project/tools/m3k-nr/dxvk-v3.0.2-m3k-source-tap.patch"
          python3 _project/tools/m3k-nr/a2-s1b-dxvk.py _dxvk
          git -C _dxvk diff --check
          grep -q 'M3K_QueryPresentSourceV1' _dxvk/src/d3d9/d3d9_swapchain.cpp
          grep -q '\[M3K-S1B\] config' _dxvk/src/d3d9/d3d9_swapchain.cpp

      - name: Build x64 presenter
        working-directory: _dxvk
        run: |
          meson setup --cross-file build-win64.txt --buildtype release build.w64
          meson compile -C build.w64 d3d9

      - name: Verify presenter
        shell: bash
        run: |
          set -euo pipefail
          dll="$(find _dxvk/build.w64/src/d3d9 -type f -iname d3d9.dll | head -n1)"
          test -n "$dll"
          cp "$dll" d3d9vk_x64.dll
          actual="$(sha256sum d3d9vk_x64.dll | awk '{print toupper($1)}')"
          echo "Presenter SHA256 for this build: $actual"
          strings d3d9vk_x64.dll | grep -q '\[M3K-S1B\] config'
          strings d3d9vk_x64.dll | grep -q 'M3K_QueryPresentSourceV1'

      - uses: actions/upload-artifact@v4
        with:
          name: cleaned-runtime-presenter
          path: d3d9vk_x64.dll
          if-no-files-found: error

  build-reshade:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone ReShade 6.8.0 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v6.8.0 --recurse-submodules --shallow-submodules https://github.com/crosire/reshade.git reshade-src
      - name: Apply b-bridge input patch
        shell: pwsh
        run: |
          & .\tools\reshade-bbridge-input\apply_patch.ps1 .\reshade-src
          if (-not $?) { throw 'ReShade patch failed' }
          $src = Get-Content .\reshade-src\source\input_windows.cpp -Raw
          if (-not $src.Contains('b-bridge cross-process input relay')) { throw 'Patched ReShade source marker missing' }
      - name: Build patched ReShade x64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsroot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsroot) { throw 'Visual Studio C++ build tools unavailable' }
          $msbuild = Join-Path $vsroot 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild .\reshade-src\ReShade.sln /t:Rebuild /m /p:Configuration=Release '/p:Platform=64-bit' /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ReShade build failed: $LASTEXITCODE" }
          $dll = '.\reshade-src\bin\x64\Release\ReShade64.dll'
          if (-not (Test-Path $dll)) { throw 'ReShade64.dll missing after build' }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          if (-not $ascii.Contains('b-bridge input relay')) { throw 'Built ReShade DLL patch marker missing' }
          New-Item -ItemType Directory -Path .\out-reshade -Force | Out-Null
          Copy-Item $dll .\out-reshade\ReShade64-bbridge.dll -Force
          Copy-Item .\reshade-src\LICENSE.md .\out-reshade\ReShade-LICENSE.md -Force
          (Get-FileHash -Algorithm SHA256 .\out-reshade\ReShade64-bbridge.dll).Hash | Set-Content .\out-reshade\ReShade64-bbridge.sha256 -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-reshade
          path: out-reshade/*

  build-runtime:
    needs: build-presenter
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download presenter built in this workflow
        uses: actions/download-artifact@v4
        with:
          name: cleaned-runtime-presenter
          path: _presenter-artifact

      - name: Verify presenter artifact
        shell: pwsh
        run: |
          $p = '.\_presenter-artifact\d3d9vk_x64.dll'
          if (-not (Test-Path -LiteralPath $p)) { throw 'Presenter artifact is missing.' }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
          if (-not $ascii.Contains('M3K_QueryPresentSourceV1')) { throw 'Presenter query marker missing.' }
          if (-not $ascii.Contains('[M3K-S1B] config')) { throw 'Presenter config marker missing.' }
          Write-Host ('Presenter SHA256 for this runtime build: ' + (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToUpperInvariant())

      - name: Checkout frozen project rendering core
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _project
          git -C _project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          if ((git -C _project rev-parse HEAD).Trim() -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw 'Wrong frozen project core' }

      - name: Attach production ReShade stages
        shell: pwsh
        run: |
          $tool = '.\_project\tools\m3k-nr'
          Copy-Item .\install\Public-ReShade-Controls-Stage.ps1 "$tool\public-reshade-controls-stage.ps1" -Force
          Copy-Item .\install\Public-Startup-Prime-Fix-Stage.ps1 "$tool\public-startup-prime-fix-stage.ps1" -Force
          Copy-Item .\install\Public-ReShade-UX-Master-Stage.ps1 "$tool\public-reshade-ux-master-stage.ps1" -Force
          Copy-Item .\install\Public-ReShade-UX-Master-Fixup.ps1 "$tool\public-reshade-ux-master-fixup.ps1" -Force
          Copy-Item .\install\Public-ReShade-UX-Master-V2-Fixup.ps1 "$tool\public-reshade-ux-master-v2-fixup.ps1" -Force
          Copy-Item .\install\Public-DLSS-CustomScale-NR-Tuning-Stage.ps1 "$tool\public-dlss-customscale-nr-tuning-stage.ps1" -Force
          $build = "$tool\build-a3-s5.ps1"
          $text = [IO.File]::ReadAllText($build)
          $anchor = "& (Join-Path `$toolRoot 'a3-s5-startup-prime-stage.ps1') -GeneratedRoot `$generated"
          $replacement = @(
            $anchor,
            "& (Join-Path `$toolRoot 'public-reshade-controls-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-startup-prime-fix-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-reshade-ux-master-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-reshade-ux-master-fixup.ps1') -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-reshade-ux-master-v2-fixup.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')",
            "& (Join-Path `$toolRoot 'public-dlss-customscale-nr-tuning-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\dlss5-feed.cpp')"
          ) -join "`r`n"
          if (($text.Split($anchor).Count - 1) -ne 1) { throw 'Could not attach production stages exactly once' }
          [IO.File]::WriteAllText($build,$text.Replace($anchor,$replacement),[Text.UTF8Encoding]::new($false))

      - name: Build production feeder and shim
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\_project\tools\m3k-nr\build-a3-s5.ps1
          if ($LASTEXITCODE -ne 0) { throw "Feeder build failed: $LASTEXITCODE" }
          if (-not (Test-Path .\_project\tools\m3k-nr\out-m3k-a3-s5\dlss5-feed.addon64)) { throw 'Feeder output missing' }
          if (-not (Test-Path .\_project\tools\m3k-nr\out-m3k-s27\m3k\m3k-nvngx.dll)) { throw 'Shim output missing' }

      - name: Build matched temporal bridge pair
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git _bbridge
          git -C _bbridge checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C _bbridge submodule update --init --recursive
          python .\_project\tools\m3k-nr\a2-s21-bbridge-ui.py .\_bbridge
          python .\_project\tools\m3k-nr\a3-s2-bbridge-coherent-draw-jitter.py .\_bbridge
          git -C _bbridge diff --check
          python -m pip install --disable-pip-version-check meson==0.64.1 ninja==1.11.1.1
          Push-Location _bbridge
          . .\build_common.ps1
          SetupVS -Platform x86
          meson setup --buildtype release --backend ninja _prebuilt32 --debug
          Copy-Item .\Directory.Build.Props .\_prebuilt32 -Force
          meson compile -C _prebuilt32 d3d9
          if ($LASTEXITCODE -ne 0) { throw "x86 d3d9 build failed: $LASTEXITCODE" }
          SetupVS -Platform x64
          meson setup --buildtype release --backend ninja _prebuilt64 --debug
          Copy-Item .\Directory.Build.Props .\_prebuilt64 -Force
          meson compile -C _prebuilt64 NvRemixBridge
          if ($LASTEXITCODE -ne 0) { throw "x64 bridge build failed: $LASTEXITCODE" }
          Pop-Location

      - name: Download pinned b-bridge release configs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .\_bbridge-release -Force | Out-Null
          gh release download v0.1.0 --repo gutbash/b-bridge --pattern 'b-bridge-0.1.0.zip' --dir .\_bbridge-release --clobber
          if ($LASTEXITCODE -ne 0) { throw "b-bridge release download failed: $LASTEXITCODE" }
          Expand-Archive -LiteralPath .\_bbridge-release\b-bridge-0.1.0.zip -DestinationPath .\_bbridge-package -Force
          $bridgeConf = Get-ChildItem .\_bbridge-package -Recurse -File -Filter 'bridge.conf' | Select-Object -First 1
          $dxvkConf = Get-ChildItem .\_bbridge-package -Recurse -File -Filter 'dxvk.conf' | Select-Object -First 1
          if (-not $bridgeConf) { throw 'bridge.conf missing from b-bridge v0.1.0 release package.' }
          if (-not $dxvkConf) { throw 'dxvk.conf missing from b-bridge v0.1.0 release package.' }
          New-Item -ItemType Directory -Path .\_bbridge-configs -Force | Out-Null
          Copy-Item $bridgeConf.FullName .\_bbridge-configs\bridge.conf -Force
          Copy-Item $dxvkConf.FullName .\_bbridge-configs\dxvk.conf -Force

      - name: Checkout redistributable runtime sources
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.15.1 https://github.com/jlrouzies-fr/DLSS5-Feeder.git _feeder-release
          git clone https://github.com/crosire/reshade-shaders.git _reshade-shaders
          git -C _reshade-shaders checkout 6db142b4b1a05c764222e5b0bd9a644b7ccfe1dc
          git lfs install
          git clone --depth 1 --branch v310.9.1 https://github.com/NVIDIA/DLSS.git _nvidia-dlss

      - name: Collect cleaned runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function AssertHash([string]$Path,[string]$Expected) {
            if (-not (Test-Path -LiteralPath $Path)) { throw "Missing runtime input: $Path" }
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash.ToUpperInvariant()
            if ($actual -ne $Expected.ToUpperInvariant()) { throw "Hash mismatch for $Path`nExpected $Expected`nActual   $actual" }
          }

          New-Item -ItemType Directory -Path .\out-runtime\m3k -Force | Out-Null
          New-Item -ItemType Directory -Path .\out-runtime\licenses -Force | Out-Null
          Copy-Item .\_bbridge\_prebuilt32\src\client\d3d9.dll .\out-runtime\d3d9.dll -Force
          Copy-Item .\_bbridge\_prebuilt64\src\server\NvRemixBridge.exe .\out-runtime\NvRemixBridge.exe -Force
          Copy-Item .\_project\tools\m3k-nr\out-m3k-a3-s5\dlss5-feed.addon64 .\out-runtime\dlss5-feed.addon64 -Force
          Copy-Item .\_project\tools\m3k-nr\out-m3k-s27\m3k\m3k-nvngx.dll .\out-runtime\m3k\m3k-nvngx.dll -Force

          # Use the presenter built and verified earlier in this same workflow run.
          Copy-Item .\_presenter-artifact\d3d9vk_x64.dll .\out-runtime\d3d9vk_x64.dll -Force

          Copy-Item .\_bbridge-configs\bridge.conf .\out-runtime\bridge.conf -Force
          Copy-Item .\_bbridge-configs\dxvk.conf .\out-runtime\dxvk.conf -Force

          $feedFx = Get-ChildItem .\_feeder-release -Recurse -File -Filter 'DLSS5_Feed.fx' | Select-Object -First 1
          if (-not $feedFx) { throw 'DLSS5_Feed.fx not found in pinned Feeder source.' }
          Copy-Item $feedFx.FullName .\out-runtime\DLSS5_Feed.fx -Force

          foreach ($name in @('ReShade.fxh','ReShadeUI.fxh','DrawText.fxh')) {
            $src = Get-ChildItem .\_reshade-shaders -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $src) { throw "$name not found in pinned reshade-shaders source." }
            Copy-Item $src.FullName (Join-Path .\out-runtime $name) -Force
          }

          $ngx = '.\_nvidia-dlss\lib\Windows_x86_64\rel\nvngx_dlss.dll'
          Copy-Item $ngx .\out-runtime\nvngx_dlss.dll -Force

          AssertHash .\out-runtime\DLSS5_Feed.fx 'CDAC08A721B14B97187DD86C5B5BEAD157C9063D7EE859A0F131A8EE791695F1'
          AssertHash .\out-runtime\nvngx_dlss.dll '3975567B8943C53ACCE397F2B72380092F84F162D00B0D2C7D08A1025C563983'
          AssertHash .\out-runtime\bridge.conf '161557ED3B3DEE86D9B9BEA3D3323924EE1F9F7FF47A139E3075B787B752EC8C'
          AssertHash .\out-runtime\dxvk.conf '509713876C2C9EFBC70D242C4474E76554C59D2A0B162695085A31B8FE772247'

          $expectedVersion = 'remix-main+1dad5e6d'
          foreach ($p in @('.\out-runtime\d3d9.dll','.\out-runtime\NvRemixBridge.exe')) {
            $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
            if (-not $ascii.Contains($expectedVersion)) { throw "$p does not embed $expectedVersion" }
          }

          foreach ($candidate in @(
            '.\_bbridge\LICENSE-MIT',
            '.\_bbridge\ThirdPartyLicenses.txt',
            '.\_feeder-release\LICENSE',
            '.\_feeder-release\LICENSE.md',
            '.\_reshade-shaders\LICENSE.md',
            '.\_nvidia-dlss\LICENSE.txt'
          )) {
            if (Test-Path -LiteralPath $candidate) { Copy-Item $candidate .\out-runtime\licenses\ -Force }
          }

          Get-ChildItem .\out-runtime -Recurse -File | ForEach-Object {
            $h=Get-FileHash -Algorithm SHA256 $_.FullName
            '{0}  {1}' -f $h.Hash,$_.FullName.Substring((Resolve-Path .\out-runtime).Path.Length+1)
          } | Set-Content .\out-runtime\SHA256SUMS.txt -Encoding ASCII

          Compress-Archive -Path .\out-runtime\* -DestinationPath .\GTAIV-DLSS-Full-Runtime.zip -CompressionLevel Optimal -Force
          $zipHash=(Get-FileHash -Algorithm SHA256 .\GTAIV-DLSS-Full-Runtime.zip).Hash.ToUpperInvariant()
          Write-Host "Clean runtime ZIP SHA256: $zipHash" -ForegroundColor Green
          $zipHash | Set-Content .\GTAIV-DLSS-Full-Runtime.sha256 -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: cleaned-prebuilt-runtime
          path: |
            GTAIV-DLSS-Full-Runtime.zip
            GTAIV-DLSS-Full-Runtime.sha256
            out-runtime/**
