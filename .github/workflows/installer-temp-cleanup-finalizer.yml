name: One-shot installer temporary-download cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/installer-temp-cleanup-finalizer.yml

permissions:
  contents: write

jobs:
  patch-installers:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installers
        shell: pwsh
        run: .\tools\installer-temp-cleanup-finalizer.ps1

      - name: Commit installer cleanup changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) { throw 'No installer changes were produced.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/Install-DLAA.bat install/Install-DLSS-Full.bat
          git commit -m 'Clean temporary installer downloads on all exits'
          git push origin HEAD:main
