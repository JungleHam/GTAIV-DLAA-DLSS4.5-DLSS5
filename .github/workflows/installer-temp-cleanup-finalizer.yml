name: One-shot installer temporary-download cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/installer-temp-cleanup-finalizer.yml'

permissions:
  contents: write

jobs:
  patch-installers:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installer temporary-download handling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function LF([string]$s) { return $s.Replace("`r`n", "`n") }
          function Replace-Once([string]$Text, [string]$Old, [string]$New, [string]$Label) {
              $Old = LF $Old
              $New = LF $New
              $count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
              if ($count -ne 1) { throw "$Label: expected exactly one match, found $count" }
              return $Text.Replace($Old, $New)
          }
          function Replace-Count([string]$Text, [string]$Old, [string]$New, [int]$Expected, [string]$Label) {
              $Old = LF $Old
              $New = LF $New
              $count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
              if ($count -ne $Expected) { throw "$Label: expected $Expected matches, found $count" }
              return $Text.Replace($Old, $New)
          }
          $utf8 = New-Object Text.UTF8Encoding($false)

          # -------------------- Install-DLAA.bat --------------------
          $dlaaPath = 'install/Install-DLAA.bat'
          $dlaa = LF ([IO.File]::ReadAllText($dlaaPath))

          $dlaa = Replace-Once $dlaa @'
    Write-Host "Downloading: $Url" -ForegroundColor Cyan
'@ @'
    Write-Host "Downloading: $Url" -ForegroundColor Cyan
    Write-Host "  Temporary file: $Dest" -ForegroundColor DarkGray
    Write-Host '  This download will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
'@ 'DLAA download destination message'

          $dlaa = Replace-Once $dlaa @'
if (-not (Is-Admin)) {
'@ @'
function Remove-TemporaryInstallerFiles {
    if (-not (Test-Path -LiteralPath $Temp)) { return }
    Write-Host "Cleaning temporary installer files: $Temp" -ForegroundColor DarkGray
    for ($attempt = 1; $attempt -le 3; $attempt++) {
        try {
            Remove-Item -LiteralPath $Temp -Recurse -Force -ErrorAction Stop
            Write-Host 'Temporary installer files deleted.' -ForegroundColor DarkGray
            return
        } catch {
            if ($attempt -lt 3) { Start-Sleep -Milliseconds 300 }
            else { Write-Host ("WARNING: Could not completely remove temporary installer folder: " + $_.Exception.Message) -ForegroundColor Yellow }
        }
    }
}

if (-not (Is-Admin)) {
'@ 'DLAA cleanup helper'

          $dlaa = Replace-Count $dlaa @'
    if (Test-Path -LiteralPath $Temp) { Remove-Item -LiteralPath $Temp -Recurse -Force }
'@ @'
    Remove-TemporaryInstallerFiles
'@ 2 'DLAA ordinary temp cleanup calls'

          $dlaa = Replace-Once $dlaa @'
    New-Item -ItemType Directory -Path $Temp -Force | Out-Null
    $bZip = Join-Path $Temp 'bbridge.zip'; $fZip = Join-Path $Temp 'feeder.zip'; $lZip = Join-Path $Temp 'lumenite.zip'; $dZip = Join-Path $Temp 'dlss.zip'
'@ @'
    New-Item -ItemType Directory -Path $Temp -Force | Out-Null
    Write-Host "Temporary download/work folder: $Temp" -ForegroundColor DarkGray
    Write-Host 'Everything downloaded into this folder will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
    $bZip = Join-Path $Temp 'bbridge.zip'; $fZip = Join-Path $Temp 'feeder.zip'; $lZip = Join-Path $Temp 'lumenite.zip'; $dZip = Join-Path $Temp 'dlss.zip'
'@ 'DLAA temp folder notice'

          $dlaa = Replace-Once $dlaa @'
    $hdrBase = 'https://raw.githubusercontent.com/crosire/reshade-shaders/6db142b4b1a05c764222e5b0bd9a644b7ccfe1dc/Shaders'
    Download-File "$hdrBase/ReShade.fxh" (Join-Path $shaderDir 'ReShade.fxh'); Download-File "$hdrBase/ReShadeUI.fxh" (Join-Path $shaderDir 'ReShadeUI.fxh'); Download-File "$hdrBase/DrawText.fxh" (Join-Path $shaderDir 'DrawText.fxh')
'@ @'
    $hdrBase = 'https://raw.githubusercontent.com/crosire/reshade-shaders/6db142b4b1a05c764222e5b0bd9a644b7ccfe1dc/Shaders'
    $headersTemp = Join-Path $Temp 'reshade-headers'
    New-Item -ItemType Directory -Path $headersTemp -Force | Out-Null
    $hdrReShade = Join-Path $headersTemp 'ReShade.fxh'
    $hdrReShadeUI = Join-Path $headersTemp 'ReShadeUI.fxh'
    $hdrDrawText = Join-Path $headersTemp 'DrawText.fxh'
    Download-File "$hdrBase/ReShade.fxh" $hdrReShade
    Download-File "$hdrBase/ReShadeUI.fxh" $hdrReShadeUI
    Download-File "$hdrBase/DrawText.fxh" $hdrDrawText
    Copy-Item -LiteralPath $hdrReShade -Destination (Join-Path $shaderDir 'ReShade.fxh') -Force
    Copy-Item -LiteralPath $hdrReShadeUI -Destination (Join-Path $shaderDir 'ReShadeUI.fxh') -Force
    Copy-Item -LiteralPath $hdrDrawText -Destination (Join-Path $shaderDir 'DrawText.fxh') -Force
'@ 'DLAA temporary ReShade header downloads'

          $dlaa = Replace-Once $dlaa @'
    if (Test-Path -LiteralPath $Temp) { try { Remove-Item -LiteralPath $Temp -Recurse -Force } catch {} }
'@ @'
    Remove-TemporaryInstallerFiles
'@ 'DLAA failure cleanup'

          [IO.File]::WriteAllText($dlaaPath, $dlaa, $utf8)

          # -------------------- Install-DLSS-Full.bat --------------------
          $fullPath = 'install/Install-DLSS-Full.bat'
          $full = LF ([IO.File]::ReadAllText($fullPath))

          $full = Replace-Once $full @'
    Write-Host "Downloading: $Url" -ForegroundColor Cyan
'@ @'
    Write-Host "Downloading: $Url" -ForegroundColor Cyan
    Write-Host "  Temporary file: $Dest" -ForegroundColor DarkGray
    Write-Host '  This download will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
'@ 'DLSS Full download destination message'

          $full = Replace-Once $full @'
function Write-NoBom([string]$Path,[string[]]$Lines) {
'@ @'
function Remove-TemporaryInstallerFiles {
    if (-not (Test-Path -LiteralPath $Temp)) { return }
    Write-Host "Cleaning temporary installer files: $Temp" -ForegroundColor DarkGray
    for ($attempt = 1; $attempt -le 3; $attempt++) {
        try {
            Remove-Item -LiteralPath $Temp -Recurse -Force -ErrorAction Stop
            Write-Host 'Temporary installer files deleted.' -ForegroundColor DarkGray
            return
        } catch {
            if ($attempt -lt 3) { Start-Sleep -Milliseconds 300 }
            else { Write-Host ("WARNING: Could not completely remove temporary installer folder: " + $_.Exception.Message) -ForegroundColor Yellow }
        }
    }
}

function Write-NoBom([string]$Path,[string[]]$Lines) {
'@ 'DLSS Full cleanup helper'

          $full = Replace-Once $full @'
    if (Test-Path -LiteralPath $Temp) { Remove-Item -LiteralPath $Temp -Recurse -Force }
    New-Item -ItemType Directory -Path $Temp -Force | Out-Null
'@ @'
    Remove-TemporaryInstallerFiles
    New-Item -ItemType Directory -Path $Temp -Force | Out-Null
    Write-Host "Temporary download/work folder: $Temp" -ForegroundColor DarkGray
    Write-Host 'Everything downloaded, cloned, or built in this folder will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
'@ 'DLSS Full temp folder notice'

          $full = Replace-Once $full @'
    Run $Git @('clone','--filter=blob:none',$RepoUrl,$Project) 'Cloning project source'
'@ @'
    Write-Host "Downloading/cloning project source into temporary folder: $Project" -ForegroundColor DarkGray
    Write-Host 'This source checkout will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
    Run $Git @('clone','--filter=blob:none',$RepoUrl,$Project) 'Cloning project source'
'@ 'DLSS Full project clone notice'

          $full = Replace-Once $full @'
    Run $Git @('clone','--filter=blob:none','https://github.com/gutbash/b-bridge.git',$BBridge) 'Cloning pinned b-bridge source'
    Run $Git @('-C',$BBridge,'checkout',$BBridgeCommit) 'Checking out pinned b-bridge commit'
    Run $Git @('-C',$BBridge,'submodule','update','--init','--recursive') 'Preparing b-bridge submodules'
'@ @'
    Write-Host "Downloading/cloning b-bridge source into temporary folder: $BBridge" -ForegroundColor DarkGray
    Write-Host 'This source checkout and its submodules will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
    Run $Git @('clone','--filter=blob:none','https://github.com/gutbash/b-bridge.git',$BBridge) 'Cloning pinned b-bridge source'
    Run $Git @('-C',$BBridge,'checkout',$BBridgeCommit) 'Checking out pinned b-bridge commit'
    Write-Host "Downloading b-bridge submodules into temporary folder: $BBridge" -ForegroundColor DarkGray
    Run $Git @('-C',$BBridge,'submodule','update','--init','--recursive') 'Preparing b-bridge submodules'
'@ 'DLSS Full b-bridge clone notice'

          $full = Replace-Once $full @'
    Run $Python @('-m','venv',$Venv) 'Creating temporary Python build environment'
    $Vpy = Join-Path $Venv 'Scripts\python.exe'
    Run $Vpy @('-m','pip','install','--disable-pip-version-check','meson==0.64.1','ninja==1.11.1.1') 'Installing pinned Meson/Ninja build tools'
'@ @'
    Run $Python @('-m','venv',$Venv) 'Creating temporary Python build environment'
    $Vpy = Join-Path $Venv 'Scripts\python.exe'
    Write-Host "Downloading temporary Python build tools into: $Venv" -ForegroundColor DarkGray
    Write-Host 'pip cache is disabled; the temporary environment will be deleted automatically after use, including if installation fails.' -ForegroundColor DarkGray
    Run $Vpy @('-m','pip','install','--disable-pip-version-check','--no-cache-dir','meson==0.64.1','ninja==1.11.1.1') 'Installing pinned Meson/Ninja build tools'
'@ 'DLSS Full pip no-cache notice'

          $full = Replace-Once $full @'
    $controlPath = Join-Path $Game 'DLSS-Full-Control.bat'
    Write-Host 'Installing DLSS-Full-Control.bat (launch / repair / diagnostics)...' -ForegroundColor Cyan
    Download-File $ControlUrl $controlPath
    Assert-SHA256 $controlPath $ControlHash
'@ @'
    $controlPath = Join-Path $Game 'DLSS-Full-Control.bat'
    $controlTemp = Join-Path $Temp 'DLSS-Full-Control.bat'
    Write-Host 'Installing DLSS-Full-Control.bat (launch / repair / diagnostics)...' -ForegroundColor Cyan
    Download-File $ControlUrl $controlTemp
    Assert-SHA256 $controlTemp $ControlHash
    Copy-Item -LiteralPath $controlTemp -Destination $controlPath -Force
'@ 'DLSS Full temporary control download'

          $full = Replace-Once $full @'
finally {
    if ($TranscriptStarted) { try { Stop-Transcript | Out-Null } catch {} }
    if (Test-Path -LiteralPath $Temp) { try { Remove-Item -LiteralPath $Temp -Recurse -Force -ErrorAction SilentlyContinue } catch {} }
}
'@ @'
finally {
    Remove-TemporaryInstallerFiles
    if ($TranscriptStarted) { try { Stop-Transcript | Out-Null } catch {} }
}
'@ 'DLSS Full finally cleanup'

          [IO.File]::WriteAllText($fullPath, $full, $utf8)

          # Static contract checks for the requested behavior.
          $dlaaCheck = [IO.File]::ReadAllText($dlaaPath)
          $fullCheck = [IO.File]::ReadAllText($fullPath)
          foreach ($text in @($dlaaCheck, $fullCheck)) {
              foreach ($marker in @('Temporary file: $Dest','deleted automatically after use','Remove-TemporaryInstallerFiles')) {
                  if (-not $text.Contains($marker)) { throw "Installer cleanup marker missing: $marker" }
              }
          }
          if ($dlaaCheck.Contains('Download-File "$hdrBase/ReShade.fxh" (Join-Path $shaderDir')) { throw 'DLAA still downloads ReShade headers directly into final install location' }
          if (-not $fullCheck.Contains("'--no-cache-dir'")) { throw 'DLSS Full pip cache is not disabled' }
          if (-not $fullCheck.Contains("$controlTemp = Join-Path $Temp 'DLSS-Full-Control.bat'")) { throw 'DLSS Full control helper is not staged through temp' }

          git diff --check
          git diff -- install/Install-DLAA.bat install/Install-DLSS-Full.bat

      - name: Commit installer cleanup changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) { throw 'No installer changes were produced.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/Install-DLAA.bat install/Install-DLSS-Full.bat
          git commit -m 'Clean temporary installer downloads on all exits'
          git push origin HEAD:main
