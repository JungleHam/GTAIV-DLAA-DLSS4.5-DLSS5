name: Build DLFG milestone-1.2 standalone POC

on:
  push:
    branches:
      - framegen-experimental
    paths:
      - 'tools/dlfg-poc/**'
      - '.github/workflows/build-dlfg-poc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build isolated standalone probe
        shell: cmd
        run: tools\dlfg-poc\BUILD-STANDALONE-CI.bat

      - name: Upload standalone probe
        uses: actions/upload-artifact@v4
        with:
          name: dlfg-milestone1.2-standalone
          path: |
            tools/dlfg-poc/standalone/NvRemixBridge.exe
            tools/dlfg-poc/RUN-STANDALONE.bat
          if-no-files-found: error
