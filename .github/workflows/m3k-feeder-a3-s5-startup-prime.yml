name: M3K Feeder A3-S5 Startup Prime

on:
  workflow_dispatch:
  push:
    branches:
      - gtaiv-m3k-a3-post-s2
    paths:
      - .github/workflows/m3k-feeder-a3-s5-startup-prime.yml
      - tools/m3k-nr/a3-s5-startup-prime-stage.ps1
      - tools/m3k-nr/build-a3-s5.ps1
      - tools/m3k-nr/a3-s4-manual-resolution-stage.ps1
      - tools/m3k-nr/build-a3-s4.ps1
      - tools/m3k-nr/a3-s3-balanced-isolation-stage.ps1
      - tools/m3k-nr/build-a3-s3.ps1
      - tools/m3k-nr/a3-s12-capture-lab-stage.ps1
      - tools/m3k-nr/build-a3-s12.ps1
      - tools/m3k-nr/a3-s11-jitter-sign-stage.ps1
      - tools/m3k-nr/build-a3-s11.ps1
      - tools/m3k-nr/a3-s1-jitter-stage.ps1
      - tools/m3k-nr/build-a3-s1.ps1
      - tools/m3k-nr/a2-s27-custom-uq-stage.ps1
      - tools/m3k-nr/build-s27.ps1
      - tools/m3k-nr/a2-s26-native-uq-stage.ps1
      - tools/m3k-nr/build-s26.ps1
      - tools/m3k-nr/a2-s25-dynamicres-stage.ps1
      - tools/m3k-nr/build-s25.ps1
      - tools/m3k-nr/a2-s24-srprofiles-stage.ps1
      - tools/m3k-nr/a2-s24-overlay-stage.ps1
      - tools/m3k-nr/build-s24.ps1
      - tools/m3k-nr/a2-s23-live-stage.ps1
      - tools/m3k-nr/build-s23.ps1
      - tools/m3k-nr/a2-s22-multipass-stage.ps1
      - tools/m3k-nr/build-s22.ps1
      - tools/m3k-nr/a2-s2-stage.ps1
      - tools/m3k-nr/compile-s2.bat
      - tools/m3k-nr/src/**
      - tools/m3k-nr/tests/**

jobs:
  build-feeder-a3-s5:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Build A3-S5 startup-prime Feeder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\m3k-nr\build-a3-s5.ps1
          Get-Content .\tools\m3k-nr\out-m3k-a3-s5\BUILD-VERIFIED.txt

      - name: Upload A3-S5 Feeder build
        uses: actions/upload-artifact@v7
        with:
          name: M3K-A3-S5-Startup-Prime-x64
          path: tools/m3k-nr/out-m3k-a3-s5
          if-no-files-found: error