# A3-S1.1 one-variable runtime A/B: bridge raster jitter unchanged, DLSS sign inverted.
name: M3K Feeder A3-S1.1 DLSS Jitter Sign Flip

on:
  workflow_dispatch:
  push:
    branches: [ gtaiv-m3k-a3-jitter-history ]
    paths:
      - '.github/workflows/m3k-feeder-a3-s11.yml'
      - 'tools/m3k-nr/a3-s11-jitter-sign-stage.ps1'
      - 'tools/m3k-nr/build-a3-s11.ps1'
      - 'tools/m3k-nr/a3-s1-jitter-stage.ps1'
      - 'tools/m3k-nr/build-a3-s1.ps1'
      - 'tools/m3k-nr/a2-s27-custom-uq-stage.ps1'
      - 'tools/m3k-nr/build-s27.ps1'
      - 'tools/m3k-nr/**'

jobs:
  build-feeder-a3-s11:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Build A3-S1.1 DLSS-only sign-flip Feeder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\m3k-nr\build-a3-s11.ps1
          Get-Content .\tools\m3k-nr\out-m3k-a3-s11\BUILD-VERIFIED.txt

      - name: Upload A3-S1.1 Feeder build
        uses: actions/upload-artifact@v7
        with:
          name: M3K-A3-S1.1-Feeder-JitterSignFlip-x64
          path: tools/m3k-nr/out-m3k-a3-s11
          if-no-files-found: error
