name: TEMP Revert Rejected Startup UI Resync

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-revert-startup-ui-resync.yml'

permissions:
  contents: write

jobs:
  revert-product-wiring:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove rejected startup UI patch from installer and manifest
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('install/Install-DLSS-Full.bat')
          text = p.read_text(encoding='utf-8')

          blocks = [
              "$StartupUiFixCommit = 'd4e4c18ae1c4f0907c58b8cdd88813e19985e798'\n$StartupUiFixUrl = \"https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$StartupUiFixCommit/install/Public-BBridge-Startup-UI-Fix.py\"\n$StartupUiFixHash = '45F4C4B7957D32BDFDC203375F1B66F500F57B8BD36419D25659BFB342435544'\n",
              "    Write-Host 'Adding the public first-launch GTA UI resync fix...' -ForegroundColor Cyan\n    $startupUiFix = Join-Path $Project 'tools\\m3k-nr\\public-bbridge-startup-ui-fix.py'\n    Download-File $StartupUiFixUrl $startupUiFix\n    Assert-SHA256 $startupUiFix $StartupUiFixHash\n\n",
              "    & $Python $startupUiFix $BBridge\n    if ($LASTEXITCODE -ne 0) { Fail 'First-launch GTA UI resync patch failed.' }\n",
          ]
          for block in blocks:
              count = text.count(block)
              if count != 1:
                  raise SystemExit(f'expected rejected UI block exactly once, found {count}: {block[:70]!r}')
              text = text.replace(block, '', 1)

          for marker in ('StartupUiFixCommit','StartupUiFixUrl','StartupUiFixHash','public-bbridge-startup-ui-fix.py','First-launch GTA UI resync patch failed'):
              if marker in text:
                  raise SystemExit(f'rejected startup UI marker still in installer: {marker}')
          if 'StartupPrimeFixCommit' not in text:
              raise SystemExit('startup-prime fix was accidentally removed')
          p.write_text(text, encoding='utf-8', newline='\n')

          mp = Path('manifests/versions.json')
          data = json.loads(mp.read_text(encoding='utf-8'))
          full = data['components']['dlss-full']
          for key in ('startup_ui_resync_commit','startup_ui_resync_sha256','startup_ui_resync_behavior'):
              full.pop(key, None)
          full['startup_ui_resync_status'] = 'rejected-after-hardware-test-pre-legal-screen-hang; not installed'
          data['project_status'] = 'tested-core-with-prime-escape-startup-ui-resync-reverted-2026-09-16'
          mp.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

      - name: Commit product rollback
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/Install-DLSS-Full.bat manifests/versions.json
          if (git diff --cached --quiet) { throw 'No product rollback produced' }
          git commit -m "Revert rejected startup UI resync from installer"
          git push origin HEAD:main
