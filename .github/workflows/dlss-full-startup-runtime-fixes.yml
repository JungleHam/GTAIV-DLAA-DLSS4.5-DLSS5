name: DLSS Full Startup Runtime Fixes Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/Install-DLSS-Full.bat'
      - 'install/Public-ReShade-Controls-Stage.ps1'
      - 'install/Public-Startup-Prime-Fix-Stage.ps1'
      - 'install/Public-BBridge-Startup-UI-Fix.py'
      - 'manifests/versions.json'
      - '.github/workflows/dlss-full-startup-runtime-fixes.yml'

jobs:
  validate-startup-runtime-fixes:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout public module
        uses: actions/checkout@v4

      - name: Verify public pins and raw bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          $manifest = Get-Content manifests/versions.json -Raw | ConvertFrom-Json

          $controlsCommit = '11ac957138d4c6376d1e6ee6413f32cf9826b422'
          $controlsHash = '0C602D710F62EB6DF15C86B7B5473A7F3E9F2E1CF3270AEA3976EA512F5907A3'
          $primeCommit = 'dfc68aea19a295ca09f68c3a7ee07eb19068f41b'
          $primeHash = 'B98BF323C3F454C2B7DB70FDCDE05B0F67954EA9507EA957F8E1A58A6A4BFBDB'
          $uiCommit = 'd4e4c18ae1c4f0907c58b8cdd88813e19985e798'
          $uiHash = '45F4C4B7957D32BDFDC203375F1B66F500F57B8BD36419D25659BFB342435544'

          foreach ($marker in @($primeCommit,$primeHash,$uiCommit,$uiHash,'public-startup-prime-fix-stage.ps1','public-bbridge-startup-ui-fix.py')) {
            if (-not $installer.Contains($marker)) { throw "Installer missing startup-fix marker: $marker" }
          }

          $full = $manifest.components.'dlss-full'
          if ($full.startup_prime_public_fix_commit -ne $primeCommit) { throw 'Manifest startup prime fix commit mismatch' }
          if ($full.startup_prime_public_fix_sha256.ToUpperInvariant() -ne $primeHash) { throw 'Manifest startup prime fix hash mismatch' }
          if ($full.startup_ui_resync_commit -ne $uiCommit) { throw 'Manifest startup UI fix commit mismatch' }
          if ($full.startup_ui_resync_sha256.ToUpperInvariant() -ne $uiHash) { throw 'Manifest startup UI fix hash mismatch' }

          $items = @(
            @{ Name='controls'; Commit=$controlsCommit; Hash=$controlsHash; Path='install/Public-ReShade-Controls-Stage.ps1' },
            @{ Name='prime'; Commit=$primeCommit; Hash=$primeHash; Path='install/Public-Startup-Prime-Fix-Stage.ps1' },
            @{ Name='ui'; Commit=$uiCommit; Hash=$uiHash; Path='install/Public-BBridge-Startup-UI-Fix.py' }
          )
          foreach ($item in $items) {
            $out = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($item.Path))
            $url = "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$($item.Commit)/$($item.Path)"
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $out
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToUpperInvariant()
            if ($actual -ne $item.Hash) { throw "$($item.Name) raw hash mismatch: $actual" }
          }
          Write-Host 'Public startup-fix pins and raw downloads verified.' -ForegroundColor Green

      - name: Checkout frozen rendering core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _verify_project
          git -C _verify_project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          if ((git -C _verify_project rev-parse HEAD).Trim() -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw 'Wrong frozen project revision' }

      - name: Attach exact public controls and startup-prime fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controlsCommit = '11ac957138d4c6376d1e6ee6413f32cf9826b422'
          $controlsHash = '0C602D710F62EB6DF15C86B7B5473A7F3E9F2E1CF3270AEA3976EA512F5907A3'
          $primeCommit = 'dfc68aea19a295ca09f68c3a7ee07eb19068f41b'
          $primeHash = 'B98BF323C3F454C2B7DB70FDCDE05B0F67954EA9507EA957F8E1A58A6A4BFBDB'

          $controls = '.\_verify_project\tools\m3k-nr\public-reshade-controls-stage.ps1'
          $prime = '.\_verify_project\tools\m3k-nr\public-startup-prime-fix-stage.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$controlsCommit/install/Public-ReShade-Controls-Stage.ps1" -OutFile $controls
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$primeCommit/install/Public-Startup-Prime-Fix-Stage.ps1" -OutFile $prime
          if ((Get-FileHash -Algorithm SHA256 $controls).Hash.ToUpperInvariant() -ne $controlsHash) { throw 'Controls raw hash mismatch' }
          if ((Get-FileHash -Algorithm SHA256 $prime).Hash.ToUpperInvariant() -ne $primeHash) { throw 'Prime-fix raw hash mismatch' }

          $build = '.\_verify_project\tools\m3k-nr\build-a3-s5.ps1'
          $text = [IO.File]::ReadAllText($build)
          $anchor = "& (Join-Path `$toolRoot 'a3-s5-startup-prime-stage.ps1') -GeneratedRoot `$generated"
          $replacement = $anchor + "`r`n& (Join-Path `$toolRoot 'public-reshade-controls-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\\dlss5-feed.cpp')" + "`r`n& (Join-Path `$toolRoot 'public-startup-prime-fix-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\\dlss5-feed.cpp')"
          if (($text.Split($anchor).Count - 1) -ne 1) { throw 'Could not attach startup stages exactly once' }
          [IO.File]::WriteAllText($build,$text.Replace($anchor,$replacement),[Text.UTF8Encoding]::new($false))

      - name: Build combined Feeder with startup-prime escape
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\_verify_project\tools\m3k-nr\build-a3-s5.ps1
          if ($LASTEXITCODE -ne 0) { throw "Combined Feeder build failed: $LASTEXITCODE" }

          $vk = Get-Content .\_verify_project\tools\m3k-nr\_work\m3k-src-a3-s5\m3k_vk.h -Raw
          $feed = Get-Content .\_verify_project\tools\m3k-nr\_work\feeder\src\dlss5-feed.cpp -Raw
          foreach ($marker in @(
            'g_m3kStartupPrimeInitialProfile',
            'STARTUP PRIME COMPLETE after %u cumulative synchronized SR frames',
            'startup prime cancelled by live profile change',
            'Startup stabilization:',
            'exits startup stabilization immediately',
            'DLAA Native',
            'True render target:',
            'DXVK source now:')) {
            if (-not (($vk + $feed).Contains($marker))) { throw "Generated startup-prime marker missing: $marker" }
          }
          if ($feed.Contains('reshade::register_overlay("M3K Capture Lab"')) { throw 'Capture Lab registration returned' }
          if (-not (Test-Path .\_verify_project\tools\m3k-nr\out-m3k-a3-s5\dlss5-feed.addon64)) { throw 'Combined Feeder output missing' }
          Write-Host 'Combined Feeder with public startup-prime escape passed.' -ForegroundColor Green

      - name: Clone and patch bridge with first-launch UI resync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git _verify_bbridge
          git -C _verify_bbridge checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C _verify_bbridge submodule update --init --recursive
          python .\_verify_project\tools\m3k-nr\a2-s21-bbridge-ui.py .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'UI virtualization patch failed' }
          python .\_verify_project\tools\m3k-nr\a3-s2-bbridge-coherent-draw-jitter.py .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'Temporal synchronization patch failed' }

          $uiCommit = 'd4e4c18ae1c4f0907c58b8cdd88813e19985e798'
          $uiHash = '45F4C4B7957D32BDFDC203375F1B66F500F57B8BD36419D25659BFB342435544'
          $ui = Join-Path $env:RUNNER_TEMP 'Public-BBridge-Startup-UI-Fix.py'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$uiCommit/install/Public-BBridge-Startup-UI-Fix.py" -OutFile $ui
          if ((Get-FileHash -Algorithm SHA256 $ui).Hash.ToUpperInvariant() -ne $uiHash) { throw 'Startup UI raw hash mismatch' }
          python $ui .\_verify_bbridge
          if ($LASTEXITCODE -ne 0) { throw 'Startup UI resync patch failed' }
          git -C _verify_bbridge diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched bridge diff check failed' }

          $window = Get-Content .\_verify_bbridge\src\client\window.cpp -Raw
          foreach ($marker in @('[M3K-UI-STARTUP]','initial logical WM_SIZE','NewGetClientRect','forwarding WM_SIZE as logical')) {
            if (-not $window.Contains($marker)) { throw "Bridge startup UI marker missing: $marker" }
          }

      - name: Setup pinned Meson
        shell: pwsh
        run: python -m pip install --disable-pip-version-check meson==0.64.1 ninja==1.11.1.1

      - name: Build matched x86/x64 bridge pair
        shell: pwsh
        working-directory: _verify_bbridge
        run: |
          $ErrorActionPreference = 'Stop'
          . .\build_common.ps1
          SetupVS -Platform x86
          meson setup --buildtype release --backend ninja _compStartup32 --debug
          Copy-Item .\Directory.Build.Props -Destination .\_compStartup32 -Force
          meson compile -C _compStartup32 d3d9
          if ($LASTEXITCODE -ne 0) { throw 'x86 bridge build failed' }

          SetupVS -Platform x64
          meson setup --buildtype release --backend ninja _compStartup64 --debug
          Copy-Item .\Directory.Build.Props -Destination .\_compStartup64 -Force
          meson compile -C _compStartup64 NvRemixBridge
          if ($LASTEXITCODE -ne 0) { throw 'x64 bridge build failed' }

          $client = '.\_compStartup32\src\client\d3d9.dll'
          $server = '.\_compStartup64\src\server\NvRemixBridge.exe'
          if (-not (Test-Path $client) -or -not (Test-Path $server)) { throw 'Matched bridge output missing' }
          $clientText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($client))
          $serverText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($server))
          foreach ($pair in @(@('client',$clientText),@('server',$serverText))) {
            if (-not $pair[1].Contains('remix-main+1dad5e6d')) { throw "$($pair[0]) does not embed pinned b-bridge version" }
          }
          Write-Host 'Matched bridge pair with startup UI resync passed.' -ForegroundColor Green
