name: Publish v1.2.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.2.1.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download exact approved v1.2.1 artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path .\_candidate -Force | Out-Null
          gh run download 35994811164 --repo "$env:GITHUB_REPOSITORY" --name 'GTAIV-Scaling-v1.2.1-release-prep' --dir .\_candidate
          if($LASTEXITCODE-ne0){throw 'Could not download approved v1.2.1 artifact.'}

          $exe=Get-ChildItem .\_candidate -Recurse -File -Filter 'GTAIV-Scaling-Setup-v1.2.1.exe' | Select-Object -First 1
          $runtime=Get-ChildItem .\_candidate -Recurse -File -Filter 'GTAIV-Scaling-Runtime-v1.2.1.zip' | Select-Object -First 1
          if(-not $exe -or -not $runtime){throw 'Approved artifact is missing installer or runtime.'}

          $exeHash=(Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToUpperInvariant()
          $runtimeHash=(Get-FileHash -Algorithm SHA256 $runtime.FullName).Hash.ToUpperInvariant()
          if($exeHash-ne'D3D0917EB69B063FAE74681B83A0B77CF2AB23E148FD41E0C2CA85EF9679C11F'){throw "Unexpected installer hash: $exeHash"}
          if($runtimeHash-ne'CCC6852CD11489EA21228B2E1B5B98B07E2FFC58BE44D36712643F7112DEC026'){throw "Unexpected runtime hash: $runtimeHash"}

          New-Item -ItemType Directory -Path .\release-assets -Force | Out-Null
          Copy-Item $exe.FullName .\release-assets\GTAIV-Scaling-Setup-v1.2.1.exe -Force
          Copy-Item $runtime.FullName .\release-assets\GTAIV-Scaling-Runtime-v1.2.1.zip -Force
          $exeHash | Set-Content .\release-assets\GTAIV-Scaling-Setup-v1.2.1.sha256 -Encoding ASCII
          $runtimeHash | Set-Content .\release-assets\GTAIV-Scaling-Runtime-v1.2.1.sha256 -Encoding ASCII

      - name: Publish final v1.2.1 release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release view v1.2.1 --repo "$env:GITHUB_REPOSITORY" *> $null
          if($LASTEXITCODE-eq0){throw 'v1.2.1 already exists; refusing to overwrite it.'}
          gh release create v1.2.1 `
            .\release-assets\GTAIV-Scaling-Setup-v1.2.1.exe `
            .\release-assets\GTAIV-Scaling-Setup-v1.2.1.sha256 `
            .\release-assets\GTAIV-Scaling-Runtime-v1.2.1.zip `
            .\release-assets\GTAIV-Scaling-Runtime-v1.2.1.sha256 `
            --repo "$env:GITHUB_REPOSITORY" `
            --target main `
            --title "GTA IV Scaling v1.2.1" `
            --notes-file .\RELEASE-v1.2.1.md `
            --latest
          if($LASTEXITCODE-ne0){throw 'GitHub v1.2.1 release creation failed.'}

# Final v1.2.1 release trigger after confirmed RC2 hardware test.
