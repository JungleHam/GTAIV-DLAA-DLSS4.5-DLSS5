name: Apply Final Public UI And Uninstaller

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-final-public-ui-uninstall.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build final public controls and uninstaller content commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-final-public-ui-uninstall.py phase1
          if ($LASTEXITCODE -ne 0) { throw "phase1 failed: $LASTEXITCODE" }
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/Public-ReShade-Controls-Stage.ps1 install/Uninstall-DLSS-Full.bat
          git commit -m 'Finalize public DLSS panel and add DLAA rollback uninstaller'

          $contentCommit = (git rev-parse HEAD).Trim()
          $stageHash = (python -c "import subprocess,hashlib; b=subprocess.check_output(['git','show','$contentCommit`:install/Public-ReShade-Controls-Stage.ps1']); print(hashlib.sha256(b).hexdigest().upper())").Trim()
          $uninstallHash = (python -c "import subprocess,hashlib; b=subprocess.check_output(['git','show','$contentCommit`:install/Uninstall-DLSS-Full.bat']); print(hashlib.sha256(b).hexdigest().upper())").Trim()
          Write-Host "CONTENT_COMMIT=$contentCommit"
          Write-Host "PUBLIC_STAGE_SHA256=$stageHash"
          Write-Host "UNINSTALLER_SHA256=$uninstallHash"

          python tools/patch-final-public-ui-uninstall.py phase2 --commit $contentCommit --stage-hash $stageHash --uninstall-hash $uninstallHash
          if ($LASTEXITCODE -ne 0) { throw "phase2 failed: $LASTEXITCODE" }
          git diff --check

          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          $stage = Get-Content install/Public-ReShade-Controls-Stage.ps1 -Raw
          $uninstaller = Get-Content install/Uninstall-DLSS-Full.bat -Raw
          foreach ($m in @('DLAA Native','True render target:','DXVK source now:')) { if (-not $stage.Contains($m)) { throw "Stage missing $m" } }
          foreach ($m in @('_DLSS_FULL_DLAA_BASELINE','Uninstall-DLSS-Full.bat',$contentCommit,$stageHash,$uninstallHash)) { if (-not $installer.Contains($m)) { throw "Installer missing $m" } }
          if (-not $uninstaller.Contains('DLAA-only runtime restored')) { throw 'Uninstaller content validation failed' }

          git add install/Install-DLSS-Full.bat manifests/versions.json .github/workflows/dlss-full-module.yml install/README.md
          git commit -m 'Pin final public controls and DLAA rollback flow'
          git push origin HEAD:main
