name: M3K DXVK Presenter Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/Install-DLSS-Full.bat'
      - 'manifests/versions.json'
      - '.github/workflows/prebuilt-runtime-release.yml'
      - '.github/workflows/m3k-dxvk-presenter-validation.yml'

jobs:
  validate-presenter:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release installer and manifest contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash='370BE394DE7BFC612D227CBE4B2A57A4AB5C23A420BE00AA839876DEF653DF97'
          $upstream='6b20f622a77b87b2921fe5d2c1774d2f2ba3e9b7'
          $checkpoint='57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f'

          $installer=Get-Content install/Install-DLSS-Full.bat -Raw
          foreach($marker in @(
            'GTAIV-DLSS-Full-Runtime.zip',
            "'d3d9vk_x64.dll'='$hash'",
            "Copy-Item -LiteralPath (Join-Path `$runtimeDir 'd3d9vk_x64.dll') -Destination (Join-Path `$Trex 'd3d9vk_x64.dll') -Force")) {
            if(-not $installer.Contains($marker)){throw "Release installer missing presenter marker: $marker"}
          }

          $manifest=Get-Content manifests/versions.json -Raw | ConvertFrom-Json
          $p=$manifest.components.'m3k-dxvk-presenter'
          if(-not $p){throw 'Manifest missing m3k-dxvk-presenter component'}
          if($p.upstream_version -ne '3.0.2'){throw 'Presenter upstream version mismatch'}
          if($p.upstream_commit -ne $upstream){throw 'Presenter upstream commit mismatch'}
          if($p.project_patch_checkpoint -ne $checkpoint){throw 'Presenter project checkpoint mismatch'}
          if($p.dll_sha256.ToUpperInvariant() -ne $hash){throw 'Presenter manifest hash mismatch'}
          if($p.installed_path -ne '.trex/d3d9vk_x64.dll' -or -not $p.installed_automatically){throw 'Presenter install contract mismatch'}
          if($manifest.components.prebuilt_release.dlss_full_runtime.files.'d3d9vk_x64.dll'.ToUpperInvariant() -ne $hash){throw 'Prebuilt runtime presenter hash mismatch in manifest'}

      - name: Download and verify presenter inside public runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir=Join-Path $env:RUNNER_TEMP 'published-runtime'
          $dir=Join-Path $env:RUNNER_TEMP 'runtime'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'No public v1.0.0 release exists yet; skipping published-runtime verification during pre-release rebuild.' -ForegroundColor Yellow
            exit 0
          }
          gh release download v1.0.0 --repo $env:GITHUB_REPOSITORY --pattern 'GTAIV-DLSS-Full-Runtime.zip' --dir $downloadDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed: $LASTEXITCODE" }
          $zip=Join-Path $downloadDir 'GTAIV-DLSS-Full-Runtime.zip'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $presenter=Join-Path $dir 'd3d9vk_x64.dll'
          $actual=(Get-FileHash -Algorithm SHA256 $presenter).Hash.ToUpperInvariant()
          $expected='370BE394DE7BFC612D227CBE4B2A57A4AB5C23A420BE00AA839876DEF653DF97'
          if($actual -ne $expected){throw "Presenter hash mismatch: expected $expected, got $actual"}
          Write-Host "PUBLIC M3K DXVK PRESENTER VERIFIED: $actual" -ForegroundColor Green
