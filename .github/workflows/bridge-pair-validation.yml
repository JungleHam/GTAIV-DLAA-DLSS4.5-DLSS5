name: Matched b-bridge Client + Server Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/Install-DLSS-Full.bat'
      - '.github/workflows/prebuilt-runtime-release.yml'
      - '.github/workflows/bridge-pair-validation.yml'

jobs:
  validate-bridge-pair:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Verify release installer uses prebuilt matched pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          foreach ($marker in @(
            'v1.0.0',
            'GTAIV-DLSS-Full-Runtime.zip',
            "'d3d9.dll'='ECA7C9CF9CD1C4835CEA7FD57AD168A35E157F081C0EADBA51AF35F501026F28'",
            "'NvRemixBridge.exe'='8A89A3DBBC02D56BA98254941B14E52D88EFEF3F95E491C9C6AF5ADC65FECFFA'",
            "Copy-Item -LiteralPath (Join-Path `$runtimeDir 'd3d9.dll') -Destination (Join-Path `$Game 'd3d9.dll') -Force",
            "Copy-Item -LiteralPath (Join-Path `$runtimeDir 'NvRemixBridge.exe') -Destination (Join-Path `$Trex 'NvRemixBridge.exe') -Force")) {
            if (-not $installer.Contains($marker)) { throw "Prebuilt matched-pair installer marker missing: $marker" }
          }
          Write-Host 'Release installer pins and deploys the prebuilt matched bridge pair.' -ForegroundColor Green

      - name: Download and verify published matched pair
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir=Join-Path $env:RUNNER_TEMP 'published-runtime'
          $dir=Join-Path $env:RUNNER_TEMP 'runtime'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          gh release download v1.0.0 --repo $env:GITHUB_REPOSITORY --pattern 'GTAIV-DLSS-Full-Runtime.zip' --dir $downloadDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed: $LASTEXITCODE" }
          $zip=Join-Path $downloadDir 'GTAIV-DLSS-Full-Runtime.zip'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $client=Join-Path $dir 'd3d9.dll'
          $server=Join-Path $dir 'NvRemixBridge.exe'
          if ((Get-FileHash -Algorithm SHA256 $client).Hash.ToUpperInvariant() -ne 'ECA7C9CF9CD1C4835CEA7FD57AD168A35E157F081C0EADBA51AF35F501026F28') { throw 'Published x86 client hash mismatch' }
          if ((Get-FileHash -Algorithm SHA256 $server).Hash.ToUpperInvariant() -ne '8A89A3DBBC02D56BA98254941B14E52D88EFEF3F95E491C9C6AF5ADC65FECFFA') { throw 'Published x64 server hash mismatch' }
          $expectedVersion='remix-main+1dad5e6d'
          foreach ($p in @($client,$server)) {
            $ascii=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
            if (-not $ascii.Contains($expectedVersion)) { throw "$p does not embed $expectedVersion" }
          }
          Write-Host "PUBLISHED MATCHED BRIDGE PAIR VERIFIED: $expectedVersion" -ForegroundColor Green

      - name: Rebuild pinned pair from source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _verify_project
          git -C _verify_project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git _verify_bbridge
          git -C _verify_bbridge checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C _verify_bbridge submodule update --init --recursive
          python .\_verify_project\tools\m3k-nr\a2-s21-bbridge-ui.py .\_verify_bbridge
          python .\_verify_project\tools\m3k-nr\a3-s2-bbridge-coherent-draw-jitter.py .\_verify_bbridge
          git -C _verify_bbridge diff --check
          python -m pip install --disable-pip-version-check meson==0.64.1 ninja==1.11.1.1
          Push-Location _verify_bbridge
          . .\build_common.ps1
          SetupVS -Platform x86
          meson setup --buildtype release --backend ninja _compPair32 --debug
          Copy-Item .\Directory.Build.Props .\_compPair32 -Force
          meson compile -C _compPair32 d3d9
          if ($LASTEXITCODE -ne 0) { throw "x86 d3d9 build failed: $LASTEXITCODE" }
          SetupVS -Platform x64
          meson setup --buildtype release --backend ninja _compPair64 --debug
          Copy-Item .\Directory.Build.Props .\_compPair64 -Force
          meson compile -C _compPair64 NvRemixBridge
          if ($LASTEXITCODE -ne 0) { throw "x64 NvRemixBridge build failed: $LASTEXITCODE" }
          $client='.\_compPair32\src\client\d3d9.dll'
          $server='.\_compPair64\src\server\NvRemixBridge.exe'
          $expectedVersion='remix-main+1dad5e6d'
          foreach ($p in @($client,$server)) {
            if (-not (Test-Path $p)) { throw "Missing rebuilt bridge file: $p" }
            $ascii=[Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($p))
            if (-not $ascii.Contains($expectedVersion)) { throw "$p does not embed $expectedVersion" }
          }
          Pop-Location
          Write-Host 'Pinned bridge pair source rebuild passed.' -ForegroundColor Green
