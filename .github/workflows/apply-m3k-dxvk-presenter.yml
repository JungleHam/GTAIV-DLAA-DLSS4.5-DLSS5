name: Apply M3K DXVK Presenter Packaging

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-m3k-dxvk-presenter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installer and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/patch-m3k-dxvk-presenter.py
          if ($LASTEXITCODE -ne 0) { throw "Presenter packaging patch failed: $LASTEXITCODE" }
          git diff --check

          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          foreach ($marker in @(
            'm3k-dxvk-v3.0.2-a2s1b/d3d9vk_x64.dll',
            '511E0C2509E1922DB2EC38940507BA956908FE6DC5FD9B3DB9FEC489DC05F297',
            '$DxvkPresenterTemp',
            "'.trex\d3d9vk_x64.dll'",
            'Installed M3K DXVK presenter hash verification failed.')) {
            if (-not $installer.Contains($marker)) { throw "Installer missing presenter marker: $marker" }
          }

      - name: Commit packaging fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/Install-DLSS-Full.bat manifests/versions.json
          git commit -m 'Package M3K DXVK render-output presenter'
          git push origin HEAD:main
