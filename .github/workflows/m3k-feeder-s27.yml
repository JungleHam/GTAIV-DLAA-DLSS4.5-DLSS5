name: M3K Feeder A2-S2.7 Custom UQ 77%

on:
  workflow_dispatch:
  push:
    branches:
      - gtaiv-m3k-a2-sr-profiles
    paths:
      - .github/workflows/m3k-feeder-s27.yml
      - tools/m3k-nr/a2-s27-custom-uq-stage.ps1
      - tools/m3k-nr/build-s27.ps1
      - tools/m3k-nr/a2-s26-native-uq-stage.ps1
      - tools/m3k-nr/build-s26.ps1
      - tools/m3k-nr/a2-s25-dynamicres-stage.ps1
      - tools/m3k-nr/build-s25.ps1
      - tools/m3k-nr/a2-s24-srprofiles-stage.ps1
      - tools/m3k-nr/a2-s24-overlay-stage.ps1
      - tools/m3k-nr/build-s24.ps1
      - tools/m3k-nr/a2-s23-live-stage.ps1
      - tools/m3k-nr/build-s23.ps1
      - tools/m3k-nr/a2-s22-multipass-stage.ps1
      - tools/m3k-nr/build-s22.ps1
      - tools/m3k-nr/a2-s2-stage.ps1
      - tools/m3k-nr/compile-s2.bat
      - tools/m3k-nr/src/**
      - tools/m3k-nr/tests/**

jobs:
  build-feeder-s27:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Build custom UQ 77% Feeder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\m3k-nr\build-s27.ps1
          Get-Content .\tools\m3k-nr\out-m3k-s27\BUILD-VERIFIED.txt

      - name: Upload A2-S2.7 live build
        uses: actions/upload-artifact@v7
        with:
          name: M3K-A2-S2.7-CustomUQ77-x64
          path: tools/m3k-nr/out-m3k-s27
          if-no-files-found: error
