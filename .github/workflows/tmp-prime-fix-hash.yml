name: TEMP Public Startup Prime Fix Hash

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-prime-fix-hash.yml'
  workflow_dispatch:

jobs:
  hash:
    runs-on: windows-2022
    steps:
      - name: Download immutable raw stage and print SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = 'dfc68aea19a295ca09f68c3a7ee07eb19068f41b'
          $url = "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$commit/install/Public-Startup-Prime-Fix-Stage.ps1"
          $out = Join-Path $env:RUNNER_TEMP 'Public-Startup-Prime-Fix-Stage.raw.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $out
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToUpperInvariant()
          Write-Host "RAW_SHA256=$hash"
          Get-Content -LiteralPath $out -TotalCount 8
