name: TEMP Public Startup Fix Hashes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-prime-fix-hash.yml'
  workflow_dispatch:

jobs:
  hash:
    runs-on: windows-2022
    steps:
      - name: Download immutable raw stages and print SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $items = @(
            @{
              Name='PRIME_FIX';
              Commit='12ae20c8789495064b32a3e0bf71072796fd46dc';
              Path='install/Public-Startup-Prime-Fix-Stage.ps1'
            },
            @{
              Name='UI_FIX';
              Commit='d4e4c18ae1c4f0907c58b8cdd88813e19985e798';
              Path='install/Public-BBridge-Startup-UI-Fix.py'
            }
          )
          foreach ($item in $items) {
            $url = "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$($item.Commit)/$($item.Path)"
            $out = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($item.Path))
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $out
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $out).Hash.ToUpperInvariant()
            Write-Host "$($item.Name)_RAW_SHA256=$hash"
          }
