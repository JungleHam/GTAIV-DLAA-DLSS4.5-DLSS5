name: One-shot matched bridge pair installer fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-matched-bridge-pair.yml'

permissions:
  contents: write

jobs:
  patch-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = ''
          $code = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $script = Join-Path $env:RUNNER_TEMP 'patch-installer.py'
          [IO.File]::WriteAllText($script,$code,(New-Object Text.UTF8Encoding($false)))
          python $script
          if ($LASTEXITCODE -ne 0) { throw "Installer patch failed: $LASTEXITCODE" }
          git diff --check

      - name: Commit installer fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/Install-DLSS-Full.bat
          git commit -m 'Install matched b-bridge client and server pair'
          git push origin HEAD:main
