name: DLSS Full Startup Runtime Fixes Validation v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'install/Install-DLSS-Full.bat'
      - 'install/Public-ReShade-Controls-Stage.ps1'
      - 'install/Public-Startup-Prime-Fix-Stage.ps1'
      - 'install/Public-BBridge-Startup-UI-Fix.py'
      - 'manifests/versions.json'
      - '.github/workflows/dlss-full-startup-runtime-fixes-v2.yml'

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify current public pins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content install/Install-DLSS-Full.bat -Raw
          $manifest = Get-Content manifests/versions.json -Raw | ConvertFrom-Json
          $primeCommit = '12ae20c8789495064b32a3e0bf71072796fd46dc'
          $primeHash = '639856C7AFBD5BBE7BC46A38E839BA8EC95D912EFE7190975315045DBB5313BF'
          $uiCommit = 'd4e4c18ae1c4f0907c58b8cdd88813e19985e798'
          $uiHash = '45F4C4B7957D32BDFDC203375F1B66F500F57B8BD36419D25659BFB342435544'
          foreach ($marker in @($primeCommit,$primeHash,$uiCommit,$uiHash)) {
            if (-not $installer.Contains($marker)) { throw "Installer pin missing: $marker" }
          }
          $full = $manifest.components.'dlss-full'
          if ($full.startup_prime_public_fix_commit -ne $primeCommit) { throw 'Manifest prime commit mismatch' }
          if ($full.startup_prime_public_fix_sha256.ToUpperInvariant() -ne $primeHash) { throw 'Manifest prime hash mismatch' }
          if ($full.startup_ui_resync_commit -ne $uiCommit) { throw 'Manifest UI commit mismatch' }
          if ($full.startup_ui_resync_sha256.ToUpperInvariant() -ne $uiHash) { throw 'Manifest UI hash mismatch' }
          foreach ($item in @(
            @{Commit=$primeCommit;Hash=$primeHash;Path='install/Public-Startup-Prime-Fix-Stage.ps1'},
            @{Commit=$uiCommit;Hash=$uiHash;Path='install/Public-BBridge-Startup-UI-Fix.py'})) {
            $out = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($item.Path))
            Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$($item.Commit)/$($item.Path)" -OutFile $out
            if ((Get-FileHash -Algorithm SHA256 $out).Hash.ToUpperInvariant() -ne $item.Hash) { throw "Raw hash mismatch: $($item.Path)" }
          }

      - name: Checkout frozen renderer core
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5.git _project
          git -C _project checkout 57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f
          if ((git -C _project rev-parse HEAD).Trim() -ne '57a8bd2ede8d7b4b721b1981bc0e8a7e6cbe084f') { throw 'Wrong renderer checkpoint' }

      - name: Attach exact public Feeder stages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $controlsCommit = '11ac957138d4c6376d1e6ee6413f32cf9826b422'
          $controlsHash = '0C602D710F62EB6DF15C86B7B5473A7F3E9F2E1CF3270AEA3976EA512F5907A3'
          $primeCommit = '12ae20c8789495064b32a3e0bf71072796fd46dc'
          $primeHash = '639856C7AFBD5BBE7BC46A38E839BA8EC95D912EFE7190975315045DBB5313BF'
          $controls = '.\_project\tools\m3k-nr\public-reshade-controls-stage.ps1'
          $prime = '.\_project\tools\m3k-nr\public-startup-prime-fix-stage.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$controlsCommit/install/Public-ReShade-Controls-Stage.ps1" -OutFile $controls
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$primeCommit/install/Public-Startup-Prime-Fix-Stage.ps1" -OutFile $prime
          if ((Get-FileHash -Algorithm SHA256 $controls).Hash.ToUpperInvariant() -ne $controlsHash) { throw 'Controls hash mismatch' }
          if ((Get-FileHash -Algorithm SHA256 $prime).Hash.ToUpperInvariant() -ne $primeHash) { throw 'Prime hash mismatch' }
          $build = '.\_project\tools\m3k-nr\build-a3-s5.ps1'
          $text = [IO.File]::ReadAllText($build)
          $anchor = "& (Join-Path `$toolRoot 'a3-s5-startup-prime-stage.ps1') -GeneratedRoot `$generated"
          if (($text.Split(@($anchor),[StringSplitOptions]::None).Count - 1) -ne 1) { throw 'A3-S5 attachment anchor mismatch' }
          $replacement = $anchor + "`r`n& (Join-Path `$toolRoot 'public-reshade-controls-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\\dlss5-feed.cpp')" + "`r`n& (Join-Path `$toolRoot 'public-startup-prime-fix-stage.ps1') -GeneratedRoot `$generated -FeederSource (Join-Path `$feeder 'src\\dlss5-feed.cpp')"
          [IO.File]::WriteAllText($build,$text.Replace($anchor,$replacement),[Text.UTF8Encoding]::new($false))

      - name: Build Feeder and CPU tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\_project\tools\m3k-nr\build-a3-s5.ps1
          if ($LASTEXITCODE -ne 0) { throw "Feeder build failed: $LASTEXITCODE" }
          $vk = Get-Content .\_project\tools\m3k-nr\_work\m3k-src-a3-s5\m3k_vk.h -Raw
          $feed = Get-Content .\_project\tools\m3k-nr\_work\feeder\src\dlss5-feed.cpp -Raw
          foreach ($marker in @('g_m3kStartupPrimeInitialProfile','STARTUP PRIME COMPLETE after %u cumulative synchronized SR frames','startup prime cancelled by live profile change','Startup stabilization:','exits startup stabilization immediately','DLAA Native','True render target:','DXVK source now:')) {
            if (-not (($vk + $feed).Contains($marker))) { throw "Generated marker missing: $marker" }
          }
          if ($feed.Contains('reshade::register_overlay("M3K Capture Lab"')) { throw 'Capture Lab registration returned' }
          if (-not (Test-Path .\_project\tools\m3k-nr\out-m3k-a3-s5\dlss5-feed.addon64)) { throw 'Feeder output missing' }
          Write-Host 'Feeder startup-prime escape build passed.' -ForegroundColor Green

      - name: Clone and patch b-bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/gutbash/b-bridge.git _bridge
          git -C _bridge checkout 1dad5e6d4dcf8647e354aa9a87f611256fb61142
          git -C _bridge submodule update --init --recursive
          python .\_project\tools\m3k-nr\a2-s21-bbridge-ui.py .\_bridge
          if ($LASTEXITCODE -ne 0) { throw 'UI virtualization patch failed' }
          python .\_project\tools\m3k-nr\a3-s2-bbridge-coherent-draw-jitter.py .\_bridge
          if ($LASTEXITCODE -ne 0) { throw 'Temporal patch failed' }
          $uiCommit = 'd4e4c18ae1c4f0907c58b8cdd88813e19985e798'
          $uiHash = '45F4C4B7957D32BDFDC203375F1B66F500F57B8BD36419D25659BFB342435544'
          $ui = Join-Path $env:RUNNER_TEMP 'Public-BBridge-Startup-UI-Fix.py'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/JungleHam/GTAIV-DLAA-DLSS4.5-DLSS5/$uiCommit/install/Public-BBridge-Startup-UI-Fix.py" -OutFile $ui
          if ((Get-FileHash -Algorithm SHA256 $ui).Hash.ToUpperInvariant() -ne $uiHash) { throw 'UI fix hash mismatch' }
          python $ui .\_bridge
          if ($LASTEXITCODE -ne 0) { throw 'First-launch UI resync patch failed' }
          git -C _bridge diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Bridge diff check failed' }
          $window = Get-Content .\_bridge\src\client\window.cpp -Raw
          foreach ($marker in @('[M3K-UI-STARTUP]','initial logical WM_SIZE','NewGetClientRect','forwarding WM_SIZE as logical')) {
            if (-not $window.Contains($marker)) { throw "Bridge UI marker missing: $marker" }
          }

      - name: Setup pinned Meson
        shell: pwsh
        run: python -m pip install --disable-pip-version-check meson==0.64.1 ninja==1.11.1.1

      - name: Build matched bridge pair
        shell: pwsh
        working-directory: _bridge
        run: |
          $ErrorActionPreference = 'Stop'
          . .\build_common.ps1
          SetupVS -Platform x86
          meson setup --buildtype release --backend ninja _comp32 --debug
          Copy-Item .\Directory.Build.Props -Destination .\_comp32 -Force
          meson compile -C _comp32 d3d9
          if ($LASTEXITCODE -ne 0) { throw 'x86 client build failed' }
          SetupVS -Platform x64
          meson setup --buildtype release --backend ninja _comp64 --debug
          Copy-Item .\Directory.Build.Props -Destination .\_comp64 -Force
          meson compile -C _comp64 NvRemixBridge
          if ($LASTEXITCODE -ne 0) { throw 'x64 server build failed' }
          $client = '.\_comp32\src\client\d3d9.dll'
          $server = '.\_comp64\src\server\NvRemixBridge.exe'
          if (-not (Test-Path $client) -or -not (Test-Path $server)) { throw 'Bridge pair output missing' }
          $ct = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($client))
          $st = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($server))
          if (-not $ct.Contains('remix-main+1dad5e6d') -or -not $st.Contains('remix-main+1dad5e6d')) { throw 'Bridge version mismatch' }
          Write-Host 'Matched bridge pair with first-launch UI resync passed.' -ForegroundColor Green
